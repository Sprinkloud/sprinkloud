}
function wireEditor(root){
  renderEdPhrases(root);
  const mark = () => { ED.dirty = true; };
  $$('[data-ef]', root).forEach(i => i.addEventListener('input', () => { ED[i.dataset.ef] = i.value; mark(); if(i.dataset.ef === 'nivel') renderEdWarn(root); }));
  if(root._edWired) return; root._edWired = true;
  root.addEventListener('input', e => { if(!ED) return; const l = e.target.closest('[data-eletra]'); if(l){ ED.frases[+l.dataset.eletra].letra = l.value; mark(); } });
  root.addEventListener('change', e => { if(!ED) return;
    const g = e.target.closest('[data-eigual]');
    if(g){ const k = +g.dataset.eigual; const v = g.value === '' ? null : +g.value;
      if(v != null && ED.frases[k].notas.length && !confirm('Esta frase ya tiene notas. Si la marcas como repetida, se reemplazan por las de la otra frase. ¿Continuar?')){ g.value = ''; return; }
      if(v == null && ED.frases[k].igual != null) ED.frases[k].notas = notasDeFrase(k).map(n => [...n]);
      ED.frases[k].igual = v; if(v != null) ED.frases[k].notas = [];
      ED.sel = null; mark(); renderEdPhrases(root); }
    if(e.target.matches('[data-ealter]')){ edAlter = e.target.checked; const scrollY = window.scrollY; root.innerHTML = editorHTML(); wireEditor(root); window.scrollTo(0, scrollY); }
  });
  root.addEventListener('click', e => { if(!ED) return;
    const pm = e.target.closest('[data-pm]');
    if(pm){ const m = +pm.dataset.pm; tone(mtof(m), .5);
      if(ED.sel){ ED.frases[ED.sel.f].notas[ED.sel.i][0] = m; }
      else { const f = ED.frases[ED.af]; if(f.igual != null){ toast(`La frase ${ED.af + 1} repite otra. Cámbiala a «Frase nueva» para escribir notas.`); return; } f.notas.push([m, ED.dur]); }
      mark(); renderEdPhrases(root); return; }
    const du = e.target.closest('[data-ed]');
    if(du){ ED.dur = +du.dataset.ed; if(ED.sel){ ED.frases[ED.sel.f].notas[ED.sel.i][1] = ED.dur; mark(); } renderEdPhrases(root); return; }
    const ec = e.target.closest('[data-ec]');
    if(ec){ const [k, i] = ec.dataset.ec.split(':').map(Number); if(ED.sel && ED.sel.f === k && ED.sel.i === i){ ED.sel = null; } else { ED.sel = {f:k, i}; ED.af = k; const n = ED.frases[k].notas[i]; ED.dur = n[1]; tone(mtof(n[0]), .45); } renderEdPhrases(root); return; }
    const mv = e.target.closest('[data-emove]');
    if(mv && ED.sel){ const arr = ED.frases[ED.sel.f].notas; const j = ED.sel.i + +mv.dataset.emove; if(j >= 0 && j < arr.length){ [arr[ED.sel.i], arr[j]] = [arr[j], arr[ED.sel.i]]; ED.sel.i = j; mark(); renderEdPhrases(root); } return; }
    if(e.target.closest('[data-eins]') && ED.sel){ const arr = ED.frases[ED.sel.f].notas; arr.splice(ED.sel.i, 0, [arr[ED.sel.i][0], ED.dur]); mark(); renderEdPhrases(root); return; }
    if(e.target.closest('[data-edeln]') && ED.sel){ borrarSel(); renderEdPhrases(root); return; }
    if(e.target.closest('[data-eunsel]')){ ED.sel = null; renderEdPhrases(root); return; }
    const df = e.target.closest('[data-edelf]');
    if(df){ const k = +df.dataset.edelf; if(ED.frases[k].notas.length && !confirm(`¿Borrar la frase ${k + 1}?`)) return;
      ED.frases.forEach(f => { if(f.igual === k){ f.notas = ED.frases[k].notas.map(n => [...n]); f.igual = null; } else if(f.igual > k) f.igual--; });
      ED.frases.splice(k, 1); ED.af = Math.min(ED.af, ED.frases.length - 1); ED.sel = null; mark(); renderEdPhrases(root); return; }
    if(e.target.closest('[data-eaddf]')){ ED.frases.push({letra:'', notas:[], igual:null}); ED.af = ED.frases.length - 1; ED.sel = null; mark(); renderEdPhrases(root); return; }
    const ph = e.target.closest('.ed-phr');
    if(ph && !e.target.closest('input,select,button')){ ED.af = +ph.dataset.fi; ED.sel = null; renderEdPhrases(root); return; }
    const pl = e.target.closest('[data-eplay]');
    if(pl){ if(pl.dataset.on){ stopPlay(); return; } const notas = ED.frases.flatMap((_, k) => notasDeFrase(k)); if(!notas.length){ toast('Añade algunas notas primero.'); return; }
      pl.dataset.on = '1'; pl.textContent = 'Detener';
      playSeq(notas, 76, i => { $$('.nc.playing', root).forEach(x => x.classList.remove('playing')); $(`.nc[data-i="${i}"]`, root)?.classList.add('playing'); }, () => { delete pl.dataset.on; pl.textContent = 'Escuchar la canción'; }); return; }
    const pd = e.target.closest('[data-epdf]');
    if(pd){ if(!window.jspdf){ toast('No se pudo preparar el PDF. Revisa tu conexión y recarga la página.'); return; } guardarBlob(() => pdfDeCancion(normalizar(docDesdeEditor())), archivo(ED.titulo || 'cancion'), pd); return; }
    if(e.target.closest('[data-ecancel]')){ if(ED.dirty && !confirm('¿Descartar los cambios de esta canción?')) return; ED = null; stopPlay(); renderRepList(); renderRepMain(); return; }
    if(e.target.closest('[data-esave]')) guardarEditor();
  });
}
function borrarSel(){ const arr = ED.frases[ED.sel.f].notas; arr.splice(ED.sel.i, 1); ED.sel = arr.length ? {f:ED.sel.f, i:Math.min(ED.sel.i, arr.length - 1)} : null; ED.dirty = true; }
document.addEventListener('keydown', e => {
  if(!ED || S.view !== 'maestra' || S.mTab !== 'rep') return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(!ED.sel) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); borrarSel(); renderEdPhrases(); }
  else if(e.key === 'Escape'){ ED.sel = null; renderEdPhrases(); }
  else if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const arr = ED.frases[ED.sel.f].notas; const j = ED.sel.i + (e.key === 'ArrowRight' ? 1 : -1); if(j >= 0 && j < arr.length){ e.preventDefault(); ED.sel.i = j; renderEdPhrases(); } }
});
function docDesdeEditor(){
  return {titulo:ED.titulo.trim(), origen:ED.origen.trim(), porque:ED.porque.trim(), nivel:+ED.nivel || 1, leccion:ED.leccion ? +ED.leccion : null,
    frases:ED.frases.map((f, k) => ({letra:f.letra.trim(), notas:notasDeFrase(k).map(n => [n[0], n[1]]), igual:f.igual})).filter(f => f.notas.length),
    actualizado:Date.now()};
}
async function guardarEditor(){
  const doc = docDesdeEditor();
  if(!doc.titulo){ toast('Ponle un nombre a la canción.'); $('[data-ef="titulo"]')?.focus(); return; }
  if(!doc.frases.length){ toast('La canción necesita al menos una nota.'); return; }
  const idx = ED.frases.map((f, k) => notasDeFrase(k).length ? k : -1).filter(k => k >= 0);
  doc.frases.forEach(f => { if(f.igual != null){ const nu = idx.indexOf(f.igual); f.igual = nu >= 0 ? nu : null; } });
  const id = ED.id || ('c-' + archivo(doc.titulo).replace(/\.pdf$/, '').toLowerCase().slice(0, 40) + '-' + Date.now().toString(36));
  doc.creado = Store.repertorio[id]?.creado || Date.now();
  const ok = await Store.saveCancion(id, doc);
  if(!ok) return;
  ED = null; repSel = id; renderRepList(); renderRepMain();
  toast(`«${doc.titulo}» se añadió al repertorio.`);
}

/* ---- PDF de una canción (formato de tarjetas) ---- */
function dibujarCancion(d, c){
  const W = 595.28, H = 841.89, MX = 46;
  const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const C = {pine:'#1E4D3A', gold:'#B8893F', ink:'#15221B', ink2:'#4B5D53', line:'#D3DFD6', soft:'#EEF4EF'};
  const SC = {sol:['#9B3D5A','#F4E3E9'], re:['#B07A1F','#F6EBD6'], la:['#2F7A55','#DDEFE4'], mi:['#3A6FA3','#DDE8F4']};
  const fill = h => d.setFillColor(...rgb(h)), stroke = h => d.setDrawColor(...rgb(h)), text = h => d.setTextColor(...rgb(h));
  const header = () => {
    try{ d.addImage(LOGO_JPG, 'JPEG', MX, 34, 52, 52); }catch(e){}
    text(C.gold); d.setFont('helvetica', 'bold'); d.setFontSize(10.5); d.text('CLUB MUSICAL SPRINKLOUD', W - MX, 58, {align:'right'});
    if(c.lecciones){ d.setFont('helvetica', 'normal'); d.setFontSize(9); text(C.ink2); d.text(c.lecciones, W - MX, 72, {align:'right'}); }
  };
  const footer = () => { stroke(C.line); d.setLineWidth(.8); d.line(MX, H - 40, W - MX, H - 40); d.setFont('helvetica', 'normal'); d.setFontSize(8); text(C.ink2); d.text(`Repertorio: ${c.titulo}`, MX, H - 28); d.text('No buscamos la perfección para practicar: practicamos para perfeccionarnos.', W - MX, H - 28, {align:'right'}); };
  const bow = (cx, ty, dn) => { stroke(C.ink2); d.setLineWidth(1.2); if(dn){ d.line(cx - 4, ty + 8, cx - 4, ty); d.line(cx + 4, ty + 8, cx + 4, ty); d.setLineWidth(2.6); d.line(cx - 4, ty, cx + 4, ty); } else { d.line(cx - 4, ty, cx, ty + 8); d.line(cx, ty + 8, cx + 4, ty); } };
  const legend = () => {
    let lx = MX; const ly = H - 66; d.setFont('helvetica', 'bold'); d.setFontSize(8);
    Object.entries(SC).forEach(([k, [sc]]) => { fill(sc); d.circle(lx + 4, ly - 3, 4, 'F'); text(C.ink); d.text('Cuerda ' + STR[k].nombre, lx + 11, ly); lx += 66; });
    d.setFont('helvetica', 'normal'); text(C.ink2);
    d.text('Círculo = dedo (0 = al aire, 2b = segundo dedo bajo).', lx + 4, ly);
    d.text('ta = 1 pulso, ti = medio, ta-a = 2, ta-i = 1 y medio.', lx + 4, ly + 11);
    bow(MX + 4, ly + 6, true); d.text('arco abajo', MX + 12, ly + 13); bow(MX + 70, ly + 6, false); d.text('arco arriba', MX + 78, ly + 13);
  };
  header();
  text(C.pine); d.setFont('helvetica', 'bold'); d.setFontSize(24); d.text(c.titulo, MX, 126);
  let y = 146; d.setFont('helvetica', 'normal'); d.setFontSize(10); text(C.ink2);
  const intro = [c.origen, c.porque].filter(Boolean).join('. ');
  if(intro){ const ls = d.splitTextToSize(intro, W - 2 * MX).slice(0, 2); d.text(ls, MX, y); y += ls.length * 13; }
  y += 4; fill(C.soft); d.roundedRect(MX, y, W - 2 * MX, 28, 8, 8, 'F');
  let x = MX + 12; const cy = y + 18; text(C.pine); d.setFont('helvetica', 'bold'); d.setFontSize(9); d.text('Mi avance:', x, cy); x += 58;
  ['La canté', 'La toqué en pizzicato', 'La toqué con arco', 'Se la toqué a alguien'].forEach(l => { stroke(C.pine); d.setLineWidth(1.1); d.setFillColor(255, 255, 255); d.roundedRect(x, cy - 9, 11, 11, 2.5, 2.5, 'FD'); text(C.ink); d.text(l, x + 16, cy); x += 16 + d.getTextWidth(l) + 16; });
  y += 48;
  const beats = Math.max(4, ...c.frases.map(beatsOf));
  const bw = Math.min(62, (W - 2 * MX - 30) / beats);
  const bottom = H - 96;
  c.frases.forEach((fr, k) => {
    const ig = c.igual?.[k]; const letra = c.letras?.[k];
    const need = ig != null ? 30 : (letra ? 16 : 0) + 84;
    if(y + need > bottom){ legend(); footer(); d.addPage(); header(); y = 110; }
    if(ig != null){
      text(C.gold); d.setFont('helvetica', 'bold'); d.setFontSize(10); d.text(String(k + 1), MX, y + 14);
      fill(C.soft); d.roundedRect(MX + 22, y, 250, 20, 6, 6, 'F'); text(C.pine); d.setFontSize(9); d.text(`Igual que la frase ${ig + 1}`, MX + 32, y + 13.5);
      if(letra){ text(C.ink2); d.setFont('helvetica', 'italic'); d.text(letra, MX + 150, y + 13.5); }
      y += 30; return;
    }
    if(letra){ text(C.ink2); d.setFont('helvetica', 'italic'); d.setFontSize(10); d.text(letra, MX + 22, y + 10); y += 16; }
    text(C.gold); d.setFont('helvetica', 'bold'); d.setFontSize(10); d.text(String(k + 1), MX, y + 28);
    let xx = MX + 22, down = true; const ch = 46;
    fr.forEach(([m, du]) => {
      const p = posFor(m); const [sc, tint] = SC[p.cuerda]; const w = Math.max(bw * du - 4, 25);
      fill(tint); stroke(sc); d.setLineWidth(1.3); d.roundedRect(xx, y, w, ch, 7, 7, 'FD');
      text(sc); d.setFont('helvetica', 'bold'); d.setFontSize(w > 34 ? 12 : 10); d.text(noteName(m), xx + w / 2, y + 17, {align:'center'});
      fill(sc); d.circle(xx + w / 2, y + 32, 8, 'F'); d.setTextColor(255, 255, 255); d.setFontSize(p.dedoCorto.length > 1 ? 8 : 9); d.text(p.dedoCorto, xx + w / 2, y + 35.2, {align:'center'});
      text(C.ink2); d.setFontSize(8); d.text(RITMO[du] || '', xx + w / 2, y + ch + 11, {align:'center'});
      bow(xx + w / 2, y + ch + 17, down); down = !down;
      xx += Math.max(bw * du, 29);
    });
    y += ch + 38;
  });
  legend(); footer();
}


function pdfDoc(){ const {jsPDF} = window.jspdf; return new jsPDF({unit:'pt', format:'a4'}); }
function pdfDeCancion(c){
  const d = pdfDoc(); dibujarCancion(d, c);
  d.setProperties({title:`${c.titulo} (Sprinkloud)`, author:'Club Musical Sprinkloud'});
  return d;
}
function pdfRepertorio(nivel, lista){
  const d = pdfDoc(); const W = 595.28, H = 841.89;
  const niv = nivelObj(nivel);
  try{ d.addImage(LOGO_JPG, 'JPEG', W / 2 - 55, 110, 110, 110); }catch(e){}
  d.setTextColor(184, 137, 63); d.setFont('helvetica', 'bold'); d.setFontSize(12); d.text('CLUB MUSICAL SPRINKLOUD', W / 2, 250, {align:'center'});
  d.setTextColor(30, 77, 58); d.setFontSize(30); d.text(niv.n === nivel ? niv.titulo : `Nivel ${nivel}`, W / 2, 300, {align:'center'});
  d.setTextColor(75, 93, 83); d.setFont('helvetica', 'normal'); d.setFontSize(13); d.text(`Repertorio del Nivel ${nivel} de violín`, W / 2, 324, {align:'center'});
  let y = 380;
  lista.forEach((c, i) => {
    if(y > H - 120) return;
    d.setDrawColor(211, 223, 214); d.setFillColor(255, 255, 255); d.setLineWidth(1); d.roundedRect(86, y - 24, W - 172, 36, 9, 9, 'FD');
    d.setTextColor(184, 137, 63); d.setFont('helvetica', 'bold'); d.setFontSize(13); d.text(String(i + 1), 104, y);
    d.setTextColor(21, 34, 27); d.text(c.titulo, 128, y);
    d.setTextColor(75, 93, 83); d.setFont('helvetica', 'normal'); d.setFontSize(10); d.text(c.lecciones || '', W - 104, y, {align:'right'});
    y += 46;
  });
  d.setTextColor(30, 77, 58); d.setFont('helvetica', 'italic'); d.setFontSize(11);
  d.text('No buscamos la perfección para practicar: practicamos para perfeccionarnos.', W / 2, H - 80, {align:'center'});
  lista.forEach(c => { d.addPage(); dibujarCancion(d, c); });
  d.setProperties({title:`Repertorio del Nivel ${nivel} (Sprinkloud)`, author:'Club Musical Sprinkloud'});
  return d;
}

/* ============ modo presentación ============ */
function openPresent(tab){ S.present = true; S.presentTab = tab || 'v3d'; renderPresent(); }
function closePresent(){ S.present = false; clearPresentMounts(); const p = $('#present'); if(p){ p.hidden = true; p.innerHTML = ''; } document.body.style.overflow = ''; }
let presentKey = '';
function renderPresent(fromData){
  const p = $('#present'); const al = Store.get(S.maestraSel); if(!p || !al){ closePresent(); return; }
  const n = leccionActual(al); const L = lec(n, al.nivel);
  const key = `${al.id}:${n}:${cancionDe(al, n)}:${S.presentTab}:${S.practica}`;
  if(fromData && key === presentKey && !p.hidden) return;
  presentKey = key;
  clearPresentMounts(); stopPlay();
  p.hidden = false; document.body.style.overflow = 'hidden';
  p.innerHTML = `<div class="present-top">
      <div class="brand">${treeIcon(28, 'var(--pine)')}</div>
      <div class="ttl"><strong>${esc(al.nombre)}</strong><span>Nivel ${al.nivel || 1}, lección ${n}: ${esc(L.titulo)}</span></div>
      <div class="tabs" role="tablist">${PTABS.map(t => `<button class="tab" role="tab" data-ptab="${t.id}" aria-selected="${t.id === S.presentTab}">${t.label}</button>`).join('')}</div>
      <button class="btn" data-pclose>Salir de la presentación</button>
    </div>
    <div class="present-body" id="present-body"></div>
    <p class="present-tip">En Google Meet: Presentar ahora, elige «Una pestaña» y selecciona esta pestaña del navegador.</p>`;
  updateLiveDots();
  const body = $('#present-body');
  if(S.presentTab === 'v3d') presentMounts.push(mountViolinist(body, {vista:L.vista}));
  if(S.presentTab === 'fb') presentMounts.push(mountFingerboard(body, al, L, {big:true}));
  if(S.presentTab === 'metro') presentMounts.push(mountMetronome(body, {big:true}));
  if(S.presentTab === 'tuner') presentMounts.push(mountTuner(body, {big:true}));
  if(S.presentTab === 'sheet'){ body.innerHTML = `<div class="card" style="max-width:1200px;margin:0 auto">${sheetBlockHTML(al, L)}</div>`; wireSheet(body, al, L); presentMounts.push(() => stopPlay()); }
  $('[data-pclose]', p).onclick = closePresent;
  $$('[data-ptab]', p).forEach(b => b.onclick = () => { S.presentTab = b.dataset.ptab; renderPresent(); });
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.present) closePresent(); });


/* ============ inicio ============ */
(async function iniciar(){
  const ses = leerSesion();
  if(ses && ses.rol){
    $('#app').innerHTML = '<div class="loading">Abriendo el club…</div>';
    try{
      if(ses.rol === 'alumno'){ await Store.entrarAlumno(ses.codigo); Object.assign(S, {rol:'alumno', codigo:ses.codigo, clave:''}); go('alumno'); return; }
      if(ses.rol === 'maestra'){ await Store.entrarMaestra(ses.clave); Object.assign(S, {rol:'maestra', clave:ses.clave, codigo:''}); go('maestra'); return; }
    }catch(e){ borrarSesion(); toast(e.message); }
  }
  go('login');
})();
/* al volver a la pestaña, trae los cambios que hizo la maestra (máximo una vez por minuto) */
let ultimaCarga = Date.now();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !S.rol || Date.now() - ultimaCarga < 60000) return;
  if(ED || S.present) return;
  ultimaCarga = Date.now(); Store.refrescar();
});
