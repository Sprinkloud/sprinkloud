<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprinkloud: Club Musical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF0EB; --surface:#FFFFFF; --surface-2:#F4F8F5; --ink:#15221B; --ink-2:#4B5D53; --line:#D3DFD6;
  --pine:#1E4D3A; --accent:#1E4D3A; --on-accent:#FFFFFF; --accent-soft:#DCEBE0;
  --gold:#B8893F; --gold-soft:#F3E6CD; --danger:#B3453A; --danger-soft:#F6DEDA;
  --s-sol:#9B3D5A; --s-re:#B07A1F; --s-la:#2F7A55; --s-mi:#3A6FA3;
  --stage:#DFE9E2; --stage-2:#F7FAF8;
  --r-l:22px; --r-m:14px; --r-s:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1712; --surface:#15231C; --surface-2:#1B2C24; --ink:#E3ECE6; --ink-2:#A1B4A9; --line:#293C32;
    --pine:#8FC8A5; --accent:#5DA67F; --on-accent:#0D1712; --accent-soft:#1F3A2D;
    --gold:#D7AE66; --gold-soft:#3A301D; --danger:#E27B6E; --danger-soft:#3C201C;
    --s-sol:#C4658A; --s-re:#D29F42; --s-la:#4FA67A; --s-mi:#6A9FD4;
    --stage:#132019; --stage-2:#1B2C23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1712; --surface:#15231C; --surface-2:#1B2C24; --ink:#E3ECE6; --ink-2:#A1B4A9; --line:#293C32;
  --pine:#8FC8A5; --accent:#5DA67F; --on-accent:#0D1712; --accent-soft:#1F3A2D;
  --gold:#D7AE66; --gold-soft:#3A301D; --danger:#E27B6E; --danger-soft:#3C201C;
  --s-sol:#C4658A; --s-re:#D29F42; --s-la:#4FA67A; --s-mi:#6A9FD4;
  --stage:#132019; --stage-2:#1B2C23;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,"Nunito Sans",system-ui,sans-serif;line-height:1.18;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
img,svg,canvas{max-width:100%}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.95rem;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pine)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1408}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(16px,2.4vw,26px)}
.muted{color:var(--ink-2)}
.fine{font-size:.85rem;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--pine)}
.tab .live{width:8px;height:8px;border-radius:50%;background:var(--gold)}
select,input[type=text],textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label.field{display:grid;gap:6px;font-weight:700;font-size:.9rem}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,34px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:700;font-size:1.15rem;color:var(--pine);letter-spacing:.01em}
.brand b{color:var(--gold);font-weight:700}
.brand small{display:block;font:600 .72rem "Nunito Sans";color:var(--ink-2);letter-spacing:0}
.top .spacer{flex:1}
.who{font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--gold-soft);color:var(--ink);font-weight:700;font-size:.8rem}

/* login */
.login{max-width:1040px;margin:0 auto;padding:clamp(16px,4vw,48px) clamp(16px,3vw,34px) 60px}
.login-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;margin-bottom:34px}
.login-hero h1{font-size:clamp(2.1rem,5.4vw,3.6rem);color:var(--pine);max-width:12ch}
.login-hero p{font-size:1.1rem;color:var(--ink-2);max-width:44ch;margin-top:14px}
.forest{width:100%;height:auto}
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.login-grid h2{font-size:1.3rem;margin-bottom:6px}
.student-pick{display:grid;gap:8px;margin-top:16px}
.student-pick button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:var(--r-m);padding:12px 16px;font-weight:700}
.student-pick button:hover{border-color:var(--pine)}
.student-pick span{font-weight:600;color:var(--ink-2);font-size:.88rem}
.notice{margin-top:18px;padding:12px 16px;border-radius:var(--r-m);background:var(--gold-soft);font-size:.9rem}

/* alumno */
.alumno{max-width:1280px;margin:0 auto;padding:0 clamp(12px,3vw,34px) 60px}
.al-hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;padding:6px 4px 20px}
.al-hero h1{font-size:clamp(1.7rem,3.6vw,2.5rem);color:var(--pine)}
.al-hero p{color:var(--ink-2);margin-top:6px}
.al-grid{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.al-main{display:grid;gap:20px;min-width:0}
.sendero-card{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));padding:18px 14px}
.sendero-card h2{font-size:1.05rem;padding:0 8px}
.sendero-card .lvl{padding:0 8px;color:var(--ink-2);font-size:.9rem;margin-bottom:6px}
.trail{width:100%;height:auto;display:block}
.trail .path{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.trail .path-done{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round}
.trail .node{cursor:pointer}
.trail .node.locked{cursor:default}
.trail .disc{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.trail .node.done .disc{fill:var(--accent-soft);stroke:var(--pine)}
.trail .node.current .disc{fill:var(--gold-soft);stroke:var(--gold);stroke-width:3}
.trail .node.viewing .disc{stroke-width:4}
.trail .tree{fill:var(--line)}
.trail .node.done .tree,.trail .node.current .tree{fill:var(--pine)}
.trail .ring{fill:none;stroke:var(--gold);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@media (prefers-reduced-motion: reduce){.trail .ring{animation:none;opacity:.5}}
.trail .t1{font:700 11px "Nunito Sans";fill:var(--ink-2)}
.trail .t2{font:700 14px Sora;fill:var(--ink)}
.trail .node.locked .t2{fill:var(--ink-2)}
.trail .st{font-size:13px;fill:var(--gold)}
.trail .st.off{fill:var(--line)}

.lesson-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.lesson-head .kicker{font-weight:800;color:var(--gold);font-size:.9rem}
.lesson-head h2{font-size:clamp(1.5rem,3vw,2.1rem);color:var(--pine);margin-top:2px}
.mission{margin-top:14px;font-size:1.2rem;font-weight:600;max-width:52ch}
.stars{display:inline-flex;gap:3px;font-size:1.25rem;color:var(--gold)}
.stars .off{color:var(--line)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.flow .step{background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;border:1px solid var(--line)}
.flow .step h3{font-size:1rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.flow .step h3 i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.8rem}
.flow .step p{font-size:.95rem;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px;margin-bottom:22px}
.facts div{border-top:1px solid var(--line);padding-top:10px}
.facts h4{font-size:.88rem;color:var(--pine);margin-bottom:3px}
.facts p{font-size:.95rem}
.sheet-box{border-top:1px solid var(--line);padding-top:18px}
.sheet-box h3{font-size:1.1rem;margin-bottom:10px}
.notes-scroll{overflow-x:auto;background:var(--surface-2);border-radius:var(--r-m);border:1px solid var(--line);padding:14px 14px 14px;margin:12px 0;display:grid;gap:10px}
.phr{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:end}
.phr-n{font:700 .9rem Sora;color:var(--gold);padding-bottom:40px}
.phr-l{font-style:italic;color:var(--ink-2);font-size:.92rem;margin-bottom:4px}
.phr-cards{display:flex;gap:4px;min-width:max-content}
.nc{flex:0 0 auto;width:max(38px,calc(var(--b) * 58px));display:grid;justify-items:center;gap:2px}
.nc-card{width:100%;border:2px solid var(--c);border-radius:10px;padding:6px 2px 7px;display:grid;justify-items:center;gap:4px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.nc-card b{font:800 .95rem "Nunito Sans";color:var(--c)}
.nc-card i{font:700 .72rem Sora;font-style:normal;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.nc-r{font-size:.72rem;font-weight:700;color:var(--ink-2)}
.nc-bow{color:var(--ink-2);height:12px}
.bow{width:12px;height:10px;display:inline-block;vertical-align:-1px}
.nc.playing .nc-card{background:var(--gold);border-color:var(--gold)}
.nc.playing .nc-card b{color:#1b1408}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pdf-frame{width:100%;height:70vh;border:1px solid var(--line);border-radius:var(--r-m);margin-top:10px;background:#fff}

.tools{padding:10px}
.tools .tabs{padding:4px 4px 10px;border-bottom:1px solid var(--line)}
.tool-body{padding:18px clamp(8px,1.6vw,18px)}

/* coach */
.coach-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.coach-avatar{width:54px;height:54px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.coach-head h3{font-size:1.15rem}
.coach-head p{color:var(--ink-2);font-size:.95rem}
.bubbles{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.nb{min-width:42px;padding:6px 8px;border-radius:12px;border:2px solid var(--c);text-align:center;font-weight:800;font-size:.85rem;line-height:1.1;background:var(--surface)}
.nb small{display:block;font-weight:700;color:var(--ink-2);font-size:.72rem}
.nb.next{background:var(--gold-soft);border-color:var(--gold)}
.nb.ok{background:var(--c);color:#fff}
.nb.ok small{color:#fff}
.nb.off{background:var(--gold-soft);border-color:var(--gold)}
.nb.miss{opacity:.45;border-style:dashed}
.live-box{display:flex;align-items:center;gap:16px;background:var(--surface-2);border-radius:var(--r-m);padding:12px 16px;margin-bottom:12px;border:1px solid var(--line)}
.live-note{font:700 2rem Sora;min-width:3.5ch;color:var(--pine)}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.rec-dot{animation:none}}
.result{margin-top:18px;border-radius:var(--r-l);background:var(--accent-soft);padding:18px 20px;display:grid;gap:12px}
.result h4{font-size:1.25rem;color:var(--pine)}
.result ul{margin:0;padding-left:20px}
.result .adjust{background:var(--surface);border-radius:var(--r-m);padding:12px 14px;border-left:4px solid var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}

/* metronome */
.metro{display:grid;justify-items:center;gap:14px;text-align:center}
.metro-beats{display:flex;gap:12px}
.metro-beats span{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .06s,transform .06s}
.metro-beats span.hit{background:var(--pine);transform:scale(1.25)}
.metro-beats span.hit.acc{background:var(--gold)}
.metro-bpm{display:flex;align-items:center;gap:16px}
.metro-bpm output{font:700 3.4rem Sora;min-width:3ch;color:var(--pine);line-height:1}
.metro-bpm button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700}
.metro input[type=range]{width:min(420px,100%);accent-color:var(--pine)}
.metro.big .metro-bpm output{font-size:6rem}
.metro.big .metro-beats span{width:40px;height:40px}

/* tuner */
.tuner{display:grid;justify-items:center;gap:10px;text-align:center}
.gauge{width:min(420px,100%);height:auto}
.gauge .arc{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
.gauge .ok{fill:none;stroke:var(--accent-soft);stroke-width:14}
.gauge .tick{stroke:var(--ink-2);stroke-width:2}
.gauge .needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:transform .12s linear;transform-origin:210px 200px}
.gauge.intune .needle{stroke:var(--pine)}
.tuner-note{font:700 3.4rem Sora;color:var(--pine);line-height:1}
.tuner-cents{font-weight:700;color:var(--ink-2);min-height:1.5em}
.tuner.big .tuner-note{font-size:6rem}
.ref-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ref-row button{border:2px solid var(--c);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800}

/* fingerboard */
.fb-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.fb-now{font-weight:700;min-height:1.6em;margin-bottom:6px;color:var(--pine)}
.fb-wrap{overflow-x:auto;border-radius:var(--r-m)}
.fb{min-width:700px;width:100%;height:auto;display:block}
.fb .board{fill:#2A1F18}
.fb .nut{fill:#E9DCC2}
.fb .tape{fill:#F2EEE4;opacity:.8}
.fb .str{stroke-linecap:round}
.fb .sname{font:800 17px Sora}
.fb .dot{cursor:pointer}
.fb .dot circle{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.25);stroke-width:1.5}
.fb .dot text{font:800 11px "Nunito Sans";fill:rgba(255,255,255,.75);text-anchor:middle;pointer-events:none}
.fb .dot .fgb{font:800 13px Sora;fill:var(--gold);opacity:0}
.fb .dot.on circle{fill:var(--c);stroke:#fff;stroke-width:2}
.fb .dot.on text{fill:#fff}
.fb .dot.on .fgb{opacity:1}
.fb .dot.hit circle{fill:var(--gold);stroke:#fff;stroke-width:3}
.fb .dot:hover circle{stroke:#fff}
.fb .dot.open circle{fill:var(--surface);stroke:var(--line)}
.fb .dot.open text{fill:var(--ink-2)}
.fb .dot.open.on circle{fill:var(--c);stroke:#fff}
.fb .dot.open.on text{fill:#fff}
.fb .open-lbl{font:700 11px "Nunito Sans";fill:var(--ink-2);text-anchor:middle}

/* 3D */
.v3d{display:grid;grid-template-columns:1fr 280px;gap:16px;min-height:480px}
.v3d-stage{position:relative;border-radius:var(--r-l);overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--stage-2),var(--stage));min-height:420px}
.v3d-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.v3d-stage canvas:active{cursor:grabbing}
.v3d-zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.v3d-zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700}
.v3d-caption{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:var(--r-m);padding:12px 14px;border:1px solid var(--line);display:grid;gap:4px;font-size:.95rem}
.v3d-caption .no{color:var(--danger);font-weight:800}
.v3d-caption .si{color:var(--pine);font-weight:800}
.v3d-panel{display:grid;gap:14px;align-content:start}
.v3d-panel h4{font-size:.92rem;color:var(--ink-2)}
.v3d-panel .chips button,.errs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.86rem}
.v3d-panel .chips button.on{border-color:var(--pine);background:var(--accent-soft);color:var(--pine)}
.errs{display:grid;gap:6px}
.errs button{text-align:left;border-radius:12px;display:flex;justify-content:space-between;gap:8px}
.errs button[aria-pressed="true"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.switch{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.switch input{accent-color:var(--pine);width:18px;height:18px}

/* maestra */
.maestra{max-width:1320px;margin:0 auto;padding:0 clamp(12px,3vw,34px) 60px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.roster{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));padding:16px}
.roster h2{font-size:1.1rem;margin:4px 6px 12px}
.roster-list{display:grid;gap:6px}
.roster-list button{display:grid;gap:2px;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:var(--r-m);padding:10px 12px}
.roster-list button:hover{background:var(--surface-2)}
.roster-list button.on{background:var(--accent-soft);border-color:var(--pine)}
.roster-list strong{font-size:1rem}
.roster-list span{font-size:.85rem;color:var(--ink-2)}
.roster form{display:flex;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.clase{display:grid;gap:18px;min-width:0}
.clase-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:end;padding:4px 4px 0}
.clase-head h1{font-size:clamp(1.6rem,3.4vw,2.3rem);color:var(--pine)}
.clase-head p{color:var(--ink-2)}
.tool-shortcuts{display:flex;flex-wrap:wrap;gap:8px}
.clase-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.clase-grid > div{display:grid;gap:18px}
.card h3{font-size:1.08rem;margin-bottom:10px}
.today .t-title{font:700 1.45rem Sora;color:var(--pine)}
.today .t-mision{margin:6px 0 14px;font-size:1.05rem}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.plan input{width:18px;height:18px;margin-top:3px;accent-color:var(--pine)}
.plan b{display:block;font-size:.88rem;color:var(--pine)}
.plan li.done label{opacity:.6}
.next-up{margin-top:14px;padding:12px 14px;border-radius:var(--r-m);border:1.5px dashed var(--gold);font-size:.95rem}
.starpick{display:flex;gap:8px;flex-wrap:wrap}
.starpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:10px 12px;display:grid;gap:2px;text-align:left;flex:1;min-width:130px}
.starpick button b{color:var(--gold);font-size:1.1rem}
.starpick button span{font-size:.82rem;color:var(--ink-2)}
.starpick button.on{border-color:var(--gold);background:var(--gold-soft)}
.practice-sum{display:grid;gap:8px}
.empty{color:var(--ink-2);padding:10px 0}

/* presentation */
.present{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) clamp(10px,2vw,24px) calc(10px + env(safe-area-inset-bottom,0px))}
.present-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.present-top .ttl{display:grid}
.present-top .ttl strong{font:700 1.2rem Sora;color:var(--pine)}
.present-top .ttl span{font-size:.9rem;color:var(--ink-2)}
.present-top .tabs{flex:1}
.present-body{flex:1;overflow:auto;padding:16px 4px}
.present-body .v3d{height:100%;min-height:520px}
.present-tip{font-size:.8rem;color:var(--ink-2);text-align:center}

.m-nav{max-width:1320px;margin:0 auto;padding:0 clamp(12px,3vw,34px) 16px}
.rep-wrap{max-width:1320px;margin:0 auto;padding:0 clamp(12px,3vw,34px) 60px}
.rep{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
#rep-main{min-width:0}
.ed-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.ed-wide{grid-column:1/-1}
.ed-tools{display:grid;gap:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:2}
.ed-tools h4{font-size:.9rem;color:var(--pine);margin-bottom:8px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{border:2px solid var(--c);background:var(--surface);border-radius:10px;padding:4px 6px;min-width:50px;display:grid;justify-items:center;gap:1px;line-height:1.1}
.pal b{color:var(--c);font-weight:800}
.pal small{font-size:.66rem;color:var(--ink-2)}
.pal i{font:700 .68rem Sora;font-style:normal;background:var(--c);color:#fff;border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
.pal:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.ed-selbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 14px;border-radius:var(--r-m);background:var(--gold-soft)}
.ed-phrases{display:grid;gap:10px;margin-top:14px}
.ed-phr{border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px 12px;cursor:pointer;overflow-x:auto}
.ed-phr.active{border-color:var(--pine);box-shadow:0 0 0 3px var(--accent-soft)}
.ed-phr.ed-rep .ed-cards{opacity:.55}
.ed-phr-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ed-phr-top input{flex:1;min-width:180px}
.ed-phr-top select{width:auto}
.ed-phr-top .phr-n{padding:0}
.ed-beats.odd{color:var(--gold);font-weight:700}
.ed-nc{border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit}
.ed-nc.sel .nc-card{outline:3px solid var(--gold);outline-offset:2px}
.ed-nc:disabled{cursor:default}
.ed-empty{color:var(--ink-2);font-size:.9rem;align-self:center;padding:10px 4px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--pine);font-style:normal;font-weight:700;font-size:.78rem;border-radius:999px;padding:2px 8px;margin-right:6px}
@media (max-width: 980px){.rep{grid-template-columns:1fr}.ed-fields{grid-template-columns:1fr}.ed-tools{position:static}}
.code-input{font:700 1.3rem Sora;letter-spacing:.14em;text-transform:uppercase}
.code-input::placeholder{font:400 1rem 'Nunito Sans',system-ui,sans-serif;letter-spacing:0;text-transform:none}
.form-err{color:var(--danger);font-weight:700;font-size:.9rem;margin-top:10px;min-height:1.2em}
.codechip{font:700 .95rem Sora;letter-spacing:.1em;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:8px;padding:2px 10px;margin-left:4px}
.save-state{min-width:8ch}
.save-state.err{color:var(--danger);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-2);font-weight:700}

@media (max-width: 980px){
  .al-grid{grid-template-columns:1fr}
  .sendero-card{position:static;order:2}
  .maestra{grid-template-columns:1fr}
  .roster{position:static}
  .clase-grid{grid-template-columns:1fr}
  .v3d{grid-template-columns:1fr}
  .login-hero{grid-template-columns:1fr}
  .login-hero svg{max-height:220px}
}
@media (max-width: 680px){
  .flow{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .login-grid{grid-template-columns:1fr}
  .metro-bpm output{font-size:2.8rem}
}

/* ============ niveles ============
   Para agregar el Nivel 2, añade otro objeto con el mismo formato que LECCIONES:
   {n:2, titulo:'Nombre del nivel', lecciones:[ {n:1, titulo:'...', ...}, ... ]} */
const NIVELES = [
  {n:1, titulo:'Mi primera canción', lecciones:LECCIONES}
];
const nivelObj = n => NIVELES.find(x => x.n === +n) || NIVELES[0];
const nivelDe = al => nivelObj(al?.nivel || 1);
const totalDe = al => nivelDe(al).lecciones.length;
const lec = (n, niv = 1) => { const ls = nivelObj(niv).lecciones; return ls[Math.min(Math.max(n, 1), ls.length) - 1]; };
const K = (al, n) => `${al?.nivel || 1}.${n}`;
const leccionActual = al => Math.min(al.leccion || 1, totalDe(al));
const nivelCompleto = al => (al.leccion || 1) > totalDe(al);

function cancionDe(al, n){
  const niv = al?.nivel || 1;
  for(let k = n; k >= 1; k--){
    const asignada = al?.canciones?.[`${niv}.${k}`];
    if(asignada && catalogo()[asignada]) return asignada;
    const sug = lec(k, niv).cancionSugerida;
    if(sug && catalogo()[sug]) return sug;
  }
  return ordenCatalogo()[0] || 'pollitos';
}

function ejercicio(key, al, L){
  if(key === 'frase' || key === 'cancion'){
    const id = cancionDe(al, L.n); const c = catalogo()[id];
    const frases = key === 'frase' ? [c.frases[0]] : c.frases;
    const letras = key === 'frase' ? [c.letras[0]] : c.letras;
    const igual = key === 'frase' ? [null] : (c.igual || frases.map(() => null));
    return {key, cancion:id, nombre: key === 'frase' ? `Primera frase de «${c.titulo}»` : `«${c.titulo}» completa`, compas:c.compas, notas:frases.flat(), frases, letras, igual};
  }
  const e = EJERCICIOS[key];
  const frases = []; let cur = [], acc = 0;
  e.notas.forEach(n => { cur.push(n); acc += n[1]; if(acc >= 8 - 1e-6){ frases.push(cur); cur = []; acc = 0; } });
  if(cur.length) frases.push(cur);
  return {key, nombre:e.nombre, compas:e.compas, notas:e.notas, frases, letras:frases.map(() => '')};
}

/* ============ audio ============ */
let AC = null;
function audio(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }
const liveTones = new Set();
function tone(freq, dur, when){
  const c = audio(); when = when ?? c.currentTime + 0.01;
  const g = c.createGain(), f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 2600; f.Q.value = .7;
  const o1 = c.createOscillator(), o2 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
  o1.type = 'sawtooth'; o2.type = 'sawtooth'; o1.frequency.value = freq; o2.frequency.value = freq * 1.003;
  lfo.frequency.value = 5.3; lg.gain.setValueAtTime(0, when); lg.gain.linearRampToValueAtTime(freq * .004, when + Math.min(.4, dur * .6));
  lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
  const peak = .11;
  g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(peak, when + .06);
  g.gain.setValueAtTime(peak, when + Math.max(.07, dur - .08)); g.gain.exponentialRampToValueAtTime(.0001, when + dur);
  [o1,o2,lfo].forEach(o => { o.start(when); o.stop(when + dur + .05); });
  const rec = {g, oscs:[o1,o2,lfo]}; liveTones.add(rec); o1.onended = () => liveTones.delete(rec);
  return rec;
}
function silence(){
  if(!AC) return; const t = AC.currentTime;
  liveTones.forEach(r => { try{ r.g.gain.cancelScheduledValues(t); r.g.gain.setTargetAtTime(.0001, t, .02); r.oscs.forEach(o => o.stop(t + .12)); }catch(e){} });
  liveTones.clear();
}
function click(when, acc){
  const c = audio(); const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = acc ? 1560 : 1040;
  g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(acc ? .22 : .13, when + .002); g.gain.exponentialRampToValueAtTime(.0001, when + .05);
  o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + .06);
}
/* reproducción de secuencias */
let playTimers = [], playEnd = null;
function stopPlay(){ playTimers.forEach(clearTimeout); playTimers = []; silence(); $$('.playing').forEach(e => e.classList.remove('playing')); $$('.hit').forEach(e => e.classList.remove('hit')); const f = playEnd; playEnd = null; f && f(); }
function playSeq(notas, bpm, onNote, onEnd){
  stopPlay(); const c = audio(); const spb = 60 / bpm; let t = c.currentTime + .12;
  notas.forEach(([m,d], i) => { tone(mtof(m), d * spb * .92, t); const ms = (t - c.currentTime) * 1000; playTimers.push(setTimeout(() => onNote && onNote(i, m), ms)); t += d * spb; });
  playEnd = onEnd || null;
  playTimers.push(setTimeout(() => { $$('.playing').forEach(e => e.classList.remove('playing')); $$('.hit').forEach(e => e.classList.remove('hit')); const f = playEnd; playEnd = null; f && f(); }, (t - c.currentTime) * 1000 + 50));
}

/* ============ micrófono y detección de altura ============ */
const Mic = {
  stream:null, an:null, buf:null, users:0,
  async start(){
    if(this.an){ this.users++; return; }
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('sin-mic');
    const c = audio();
    this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const src = c.createMediaStreamSource(this.stream);
    this.an = c.createAnalyser(); this.an.fftSize = 2048; src.connect(this.an);
    this.buf = new Float32Array(this.an.fftSize); this.users = 1;
  },
  stop(){ this.users--; if(this.users <= 0){ this.stream?.getTracks().forEach(t => t.stop()); this.stream = null; this.an = null; this.users = 0; } },
  read(){ if(!this.an) return {f:-1, rms:0}; this.an.getFloatTimeDomainData(this.buf); return detectPitch(this.buf, AC.sampleRate); }
};
function detectPitch(buf, sr){
  let n = buf.length, rms = 0;
  for(let i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n);
  if(rms < .012) return {f:-1, rms};
  let r1 = 0, r2 = n - 1; const th = .2;
  for(let i = 0; i < n / 2; i++) if(Math.abs(buf[i]) < th){ r1 = i; break; }
  for(let i = 1; i < n / 2; i++) if(Math.abs(buf[n - i]) < th){ r2 = n - i; break; }
  const b = buf.slice(r1, r2); n = b.length;
  const maxLag = Math.min(n, Math.floor(sr / 150));
  const c = new Float32Array(maxLag);
  for(let i = 0; i < maxLag; i++){ let s = 0; for(let j = 0; j < n - i; j++) s += b[j] * b[j + i]; c[i] = s; }
  let d = 0; while(d < maxLag - 1 && c[d] > c[d + 1]) d++;
  let mv = -1, mp = -1;
  for(let i = d; i < maxLag; i++) if(c[i] > mv){ mv = c[i]; mp = i; }
  if(mp <= 0 || mp >= maxLag - 1) return {f:-1, rms};
  const x1 = c[mp - 1], x2 = c[mp], x3 = c[mp + 1], a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  const T0 = a ? mp - bb / (2 * a) : mp;
  const f = sr / T0;
  return {f: f > 150 && f < 1500 ? f : -1, rms};
}


/* ============ conexión con la hoja de Google (Apps Script) ============ */
const clonar = o => JSON.parse(JSON.stringify(o));
const Api = {
  async call(accion, datos = {}){
    if(!API_URL) return Demo.call(accion, clonar(datos));
    let r;

const ordenar = arr => arr.slice().sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
let pendientes = 0;
function estadoGuardado(delta, error){
  pendientes = Math.max(0, pendientes + delta);
  const el = $('#save-state'); if(!el) return;
  el.textContent = error ? 'No se guardó un cambio' : pendientes ? 'Guardando…' : 'Todo guardado';
  el.classList.toggle('err', !!error);
}
const Store = {
  alumnos:[], repertorio:{}, alumno:null, subs:new Set(),
  on(f){ this.subs.add(f); },
  emit(){ this.subs.forEach(f => { try{ f(); }catch(e){ console.error(e); } }); },
  get(id){ return this.alumno && this.alumno.id === id ? this.alumno : this.alumnos.find(a => a.id === id); },
  async entrarAlumno(codigo){ const r = await Api.call('alumno', {codigo}); this.alumno = r.alumno; this.repertorio = r.repertorio || {}; this.emit(); },
  async entrarMaestra(clave){ const r = await Api.call('maestra', {clave}); this.alumnos = ordenar(r.alumnos || []); this.repertorio = r.repertorio || {}; this.emit(); },
  async refrescar(){
    if(pendientes) return;
    try{ if(S.rol === 'alumno') await this.entrarAlumno(S.codigo); else if(S.rol === 'maestra') await this.entrarMaestra(S.clave); }catch(e){}
  },
  async update(id, patch){
    const a = this.get(id); if(a) Object.assign(a, clonar(patch));
    this.emit(); estadoGuardado(1);
    try{ await Api.call('guardarAlumno', {clave:S.clave, id, cambios:patch}); estadoGuardado(-1); }
    catch(e){ estadoGuardado(-1, true); toast('No se guardó el cambio: ' + e.message); }
  },
  async add(nombre){
    estadoGuardado(1);
    try{ const r = await Api.call('nuevoAlumno', {clave:S.clave, nombre}); this.alumnos = ordenar([...this.alumnos, r.alumno]); estadoGuardado(-1); this.emit(); return r.alumno; }
    catch(e){ estadoGuardado(-1, true); toast(e.message); return null; }
  },
  async remove(id){
    this.alumnos = this.alumnos.filter(a => a.id !== id); this.emit(); estadoGuardado(1);
    try{ await Api.call('borrarAlumno', {clave:S.clave, id}); estadoGuardado(-1); }catch(e){ estadoGuardado(-1, true); toast('No se pudo quitar al alumno: ' + e.message); }
  },
  async saveCancion(id, data){
    this.repertorio[id] = clonar(data); this.emit(); estadoGuardado(1);

    catch(e){ estadoGuardado(-1, true); toast('No se guardó la canción: ' + e.message); return false; }
  },
  async deleteCancion(id){
    delete this.repertorio[id]; this.emit(); estadoGuardado(1);
    try{ await Api.call('borrarCancion', {clave:S.clave, id}); estadoGuardado(-1); }catch(e){ estadoGuardado(-1, true); toast('No se pudo borrar la canción: ' + e.message); }
  }
};

function senderoSVG(al, ver){
  const niv = nivelDe(al), ls = niv.lecciones, total = ls.length;
  const W = 340, step = 96, top = 50;
  const pts = ls.map((L, i) => ({x: i % 2 ? 128 : 58, y: top + i * step}));
  const H = top + (total - 1) * step + 60;
  const curva = arr => arr.map((p, i) => { if(i === 0) return `M${p.x} ${p.y}`; const q = arr[i - 1]; const my = (q.y + p.y) / 2; return `C${q.x} ${my} ${p.x} ${my} ${p.x} ${p.y}`; }).join(' ');
  const actual = al.leccion || 1;
  const donePts = pts.slice(0, Math.min(actual, total));
  let o = `<h2>Nivel ${niv.n}: ${esc(niv.titulo)}</h2><p class="lvl">Toca un árbol para repasar esa lección.</p>
  <svg class="trail" viewBox="0 0 ${W} ${H}" role="list">
    <path class="path" d="${curva(pts)}"/>${donePts.length > 1 ? `<path class="path-done" d="${curva(donePts)}"/>` : ''}`;
  ls.forEach((L, i) => {
    const p = pts[i]; const n = L.n;
    const est = (al.estrellas || {})[K(al, n)] || 0;
    const st = n < actual ? 'done' : n === actual ? 'current' : 'locked';
    o += `<g class="node ${st}${n === ver ? ' viewing' : ''}" role="listitem" ${st !== 'locked' ? `tabindex="0" data-ver="${n}"` : ''} aria-label="Lección ${n}: ${esc(L.titulo)}${st === 'locked' ? ', bloqueada' : ''}">
      ${st === 'current' ? `<circle class="ring" cx="${p.x}" cy="${p.y}" r="30"/>` : ''}
      <circle class="disc" cx="${p.x}" cy="${p.y}" r="30"/>
      <g transform="translate(${p.x - 16} ${p.y - 17})"><path class="tree" d="M16 0 5 15h6L3 25h8L1 34h30L21 25h8L21 15h6z"/></g>
      <text class="t1" x="182" y="${p.y - 10}">Lección ${n}</text>
      <text class="t2" x="182" y="${p.y + 8}">${esc(L.titulo)}</text>
      <text x="182" y="${p.y + 27}">${[1,2,3].map(k => `<tspan class="st ${k <= est ? '' : 'off'}">★</tspan>`).join(' ')}</text>
    </g>`;
  });
  return o + '</svg>';
}

/* ---- PDFs (se crean en el navegador, sin servidor) ---- */
function archivo(t){ return (t || 'cancion').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '') + '.pdf'; }
function hayPdf(){ if(!window.jspdf){ toast('No se pudo preparar el PDF. Revisa tu conexión y recarga la página.'); return false; } return true; }
async function guardarBlob(getDoc, nombre, btn){
  if(!hayPdf()) return;
  const txt = btn?.textContent; if(btn){ btn.disabled = true; btn.textContent = 'Preparando…'; }
  try{ const d = await getDoc(); d.save(nombre); }
  catch(e){ console.error(e); toast('No se pudo crear el PDF.'); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = txt; } }
}
function descargarCancion(id, btn){ const c = catalogo()[id]; if(c) guardarBlob(() => pdfDeCancion(c), archivo(c.titulo), btn); }
function abrirCancion(id){
  if(!hayPdf()) return; const c = catalogo()[id]; if(!c) return;
  const w = window.open(pdfDeCancion(c).output('bloburl'), '_blank');
  if(!w) toast('El navegador bloqueó la ventana nueva. Usa «Descargar PDF».');
}
function descargarRepertorio(nivel, btn){
  const cat = catalogo();
  const lista = ordenCatalogo().map(id => cat[id]).filter(c => (c.nivel || 1) === nivel);
  if(!lista.length){ toast('Todavía no hay canciones en este nivel.'); return; }
  guardarBlob(() => pdfRepertorio(nivel, lista), `Repertorio_Nivel${nivel}_Sprinkloud.pdf`, btn);
}

/* ============ metrónomo ============ */
const Metro = {
  on:false, bpm:72, beats:4, beat:0, next:0, timer:0, subs:new Set(),
  start(){ const c = audio(); this.on = true; this.beat = 0; this.next = c.currentTime + .08; clearInterval(this.timer); this.timer = setInterval(() => this.sched(), 25); this.emit('state'); },
  stop(){ this.on = false; clearInterval(this.timer); this.emit('state'); },
  sched(){ const c = audio(); while(this.next < c.currentTime + .1){ const b = this.beat; click(this.next, b === 0); const ms = (this.next - c.currentTime) * 1000; setTimeout(() => this.emit('beat', b), Math.max(0, ms)); this.next += 60 / this.bpm; this.beat = (this.beat + 1) % this.beats; } },
  emit(t, b){ this.subs.forEach(f => f(t, b)); }
};
function mountMetronome(el, {big}){
  el.innerHTML = `<div class="metro${big ? ' big' : ''}">
    <div class="metro-beats" aria-hidden="true"></div>
    <div class="metro-bpm"><button data-d="-1" aria-label="Más lento">−</button><output aria-live="polite">${Metro.bpm}</output><button data-d="1" aria-label="Más rápido">+</button></div>
    <span class="muted">pulsos por minuto</span>
    <input type="range" min="40" max="180" value="${Metro.bpm}" aria-label="Velocidad del metrónomo">
    <div class="seg" role="group" aria-label="Pulsos por compás">${[2,3,4].map(n => `<button data-b="${n}" aria-pressed="${Metro.beats === n}">${n} pulsos</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" data-go>${Metro.on ? 'Detener' : 'Iniciar'}</button><button class="btn" data-tap>Marcar el tempo con toques</button></div>
  </div>`;
  const out = $('output', el), rng = $('input', el), beatsEl = $('.metro-beats', el), goB = $('[data-go]', el);
  const drawBeats = () => { beatsEl.innerHTML = Array.from({length:Metro.beats}, (_, i) => `<span class="${i === 0 ? 'acc' : ''}"></span>`).join(''); };
  drawBeats();
  const setBpm = v => { Metro.bpm = Math.max(40, Math.min(180, Math.round(v))); out.textContent = Metro.bpm; rng.value = Metro.bpm; };
  $$('[data-d]', el).forEach(b => b.onclick = () => setBpm(Metro.bpm + +b.dataset.d));
  rng.oninput = () => setBpm(+rng.value);
  $$('[data-b]', el).forEach(b => b.onclick = () => { Metro.beats = +b.dataset.b; Metro.beat = 0; $$('[data-b]', el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawBeats(); });
  goB.onclick = () => Metro.on ? Metro.stop() : Metro.start();
  let taps = [];
  $('[data-tap]', el).onclick = () => { const t = performance.now(); taps = taps.filter(x => t - x < 3000); taps.push(t); if(taps.length >= 2){ const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); setBpm(60000 / iv); } };
  const sub = (t, b) => {
    if(t === 'state'){ goB.textContent = Metro.on ? 'Detener' : 'Iniciar'; updateLiveDots(); }
    if(t === 'beat'){ const spans = $$('span', beatsEl); spans.forEach((s,i) => s.classList.toggle('hit', i === b)); setTimeout(() => spans[b]?.classList.remove('hit'), 110); }
  };
  Metro.subs.add(sub);
  return () => Metro.subs.delete(sub);
}
function updateLiveDots(){ $$('[data-tool="metro"],[data-ptab="metro"]').forEach(b => { let d = $('.live', b); if(Metro.on && !d){ b.insertAdjacentHTML('beforeend', '<span class="live" aria-label="sonando"></span>'); } if(!Metro.on && d) d.remove(); }); }

function mountTuner(el, {big}){
  el.innerHTML = `<div class="tuner${big ? ' big' : ''}">
    <svg class="gauge" viewBox="0 0 420 230" aria-hidden="true">
      <path class="arc" d="M40 200 A170 170 0 0 1 380 200"/>
      <path class="ok" d="M180.6 32.6 A170 170 0 0 1 239.4 32.6"/>
      ${[-50,-25,0,25,50].map(c => { const a = (c / 50) * 70 * Math.PI / 180; const x1 = 210 + Math.sin(a) * 150, y1 = 200 - Math.cos(a) * 150, x2 = 210 + Math.sin(a) * 186, y2 = 200 - Math.cos(a) * 186; return `<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }).join('')}
      <text x="40" y="226" fill="var(--ink-2)" font-size="13" font-weight="700" text-anchor="middle">bajo</text>
      <text x="380" y="226" fill="var(--ink-2)" font-size="13" font-weight="700" text-anchor="middle">alto</text>

      <circle cx="210" cy="200" r="9" fill="var(--ink)"/>
    </svg>
    <div class="tuner-note">—</div>
    <div class="tuner-cents">Activa el micrófono y toca una cuerda.</div>
    <button class="btn primary" data-mic>Activar micrófono</button>
    <div><p class="fine" style="margin:8px 0">Escucha la nota de cada cuerda:</p>
    <div class="ref-row">${Object.values(STR).map(s => `<button style="--c:${s.color}" data-ref="${s.midi}">${s.nombre}</button>`).join('')}</div></div>
  </div>`;
  const needle = $('.needle', el), gauge = $('.gauge', el), noteEl = $('.tuner-note', el), cEl = $('.tuner-cents', el), micB = $('[data-mic]', el);
  let on = false, raf = 0, sm = 0, last = 0, holdUntil = 0;
  $$('[data-ref]', el).forEach(b => b.onclick = () => tone(mtof(+b.dataset.ref), 2.2));
  const loop = t => {
    raf = requestAnimationFrame(loop);
    if(t - last < 45) return; last = t;
    const {f} = Mic.read();
    if(f > 0){
      const m = ftom(f), r = Math.round(m), cents = (m - r) * 100;
      sm = sm * .6 + cents * .4; holdUntil = t + 700;
      noteEl.textContent = noteName(r);
      const inT = Math.abs(sm) <= 8;
      gauge.classList.toggle('intune', inT);
      cEl.textContent = inT ? '¡Afinado!' : sm > 0 ? `Un poco alto (+${Math.round(sm)})` : `Un poco bajo (${Math.round(sm)})`;
      needle.style.transform = `rotate(${Math.max(-50, Math.min(50, sm)) / 50 * 70}deg)`;
    } else if(t > holdUntil){ cEl.textContent = 'Toca una cuerda o una nota.'; gauge.classList.remove('intune'); }
  };
  micB.onclick = async () => {
    if(on){ on = false; cancelAnimationFrame(raf); Mic.stop(); micB.textContent = 'Activar micrófono'; noteEl.textContent = '—'; cEl.textContent = 'Micrófono apagado.'; needle.style.transform = ''; return; }
    try{ await Mic.start(); on = true; micB.textContent = 'Apagar micrófono'; cEl.textContent = 'Escuchando…'; raf = requestAnimationFrame(loop); }
    catch(e){ cEl.textContent = 'No se pudo usar el micrófono. Permite el acceso al micrófono en el navegador y vuelve a intentarlo.'; }
  };
  return () => { cancelAnimationFrame(raf); if(on) Mic.stop(); };
}

  el.innerHTML = `<div class="fb-bar">
      <div class="seg" role="group" aria-label="Qué mostrar">${modos.map(m => `<button data-modo="${m.id}" aria-pressed="${m.id === modo}">${esc(m.nombre)}</button>`).join('')}</div>

  const nowEl = $('.fb-now', el), playB = $('[data-fbplay]', el), bpm = $('[data-fbbpm]', el);
  const keyOf = m => { const p = posFor(m); return `${p.cuerda}-${p.off}`; };
  const paint = () => {
    const md = modos.find(x => x.id === modo);
    $$('.dot', el).forEach(d => d.classList.remove('on'));
    if(modo === 'todas'){ $$('.dot', el).forEach(d => d.classList.add('on')); return; }
    md.notas.forEach(([m]) => $(`.dot[data-k="${keyOf(m)}"]`, el)?.classList.add('on'));
  };
  paint();
  $$('[data-modo]', el).forEach(b => b.onclick = () => { modo = b.dataset.modo; stopPlay(); $$('[data-modo]', el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); paint(); nowEl.textContent = modo === 'todas' ? 'Todas las notas de la primera posición.' : 'Los puntos de color son las notas que vas a usar.'; });
  const describe = m => { const p = posFor(m); return `${noteName(m)}: cuerda ${STR[p.cuerda].nombre}, ${p.off === 0 ? 'cuerda al aire' : `dedo ${p.dedo}`}`; };

function fbSVG(){
  const rows = [['mi',56],['la',116],['re',176],['sol',236]];
  const nut = 130, K = 2280, END = 990;
  const fx = n => nut + (1 - Math.pow(2, -n / 12)) * K;
  const X = n => n === 0 ? nut - 50 : fx(n) - 20;
  const widths = {mi:1.6, la:2.2, re:2.9, sol:3.8};
  let o = `<svg class="fb" viewBox="0 0 1000 290" role="group" aria-label="Diapasón del violín en primera posición">`;
  o += `<rect class="board" x="${nut}" y="24" width="${END - nut}" height="244" rx="12"/>`;
  [2,4,5].forEach(n => o += `<rect class="tape" x="${fx(n) - 6}" y="24" width="6" height="244"/>`);
  o += `<rect class="nut" x="${nut - 6}" y="20" width="10" height="252" rx="3"/>`;
  o += `<text class="open-lbl" x="${nut - 50}" y="16">al aire</text>`;
  rows.forEach(([s, y]) => {
    const S0 = STR[s];
    o += `<text class="sname" x="10" y="${y + 6}" fill="${S0.color}">${S0.nombre}</text>`;
    o += `<line class="str" x1="${nut - 30}" x2="${END}" y1="${y}" y2="${y}" stroke="${S0.color}" stroke-width="${widths[s]}"/>`;
    for(let n = 0; n <= 7; n++){
      const m = S0.midi + n; const x = X(n);
      o += `<g class="dot${n === 0 ? ' open' : ''}" data-m="${m}" data-k="${s}-${n}" style="--c:${S0.color}" tabindex="0" role="button" aria-label="${noteName(m)} en la cuerda ${S0.nombre}"><circle cx="${x}" cy="${y}" r="18"/><text x="${x}" y="${y + 4}">${noteName(m)}</text><text class="fgb" x="${x}" y="${y - 23}">${DEDO_C[n]}</text></g>`;
    }
  });
  return o + '</svg>';
}

    if(instant || matchMedia('(prefers-reduced-motion: reduce)').matches){ Object.assign(cam, {target:to.target, r:to.r, th:to.th, ph:to.ph}); tween = null; return; }

  $$('[data-view]', el).forEach(b => b.onclick = () => { viewId = b.dataset.view; goView(viewId); });
  $$('[data-pose]', el).forEach(b => b.onclick = () => { st.sentado = b.dataset.pose === '1'; $$('[data-pose]', el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); lastPose = pose(); goView(viewId); });
  $$('[data-err]', el).forEach(b => b.onclick = () => {
    const id = b.dataset.err; st.err[id] = !st.err[id]; st.lastErr = st.err[id] ? id : st.lastErr; b.setAttribute('aria-pressed', String(!!st.err[id])); paintErrors();
    const viewFor = {pies:'pies', espalda:'general', hombro:'hombros', codo:'manoIzq', muneca:'manoIzq', arco:'manoDer'};

/* ============ vista maestra ============ */
function viewMaestra(){
  return `${topBar('maestra')}
  <nav class="m-nav"><div class="seg" role="group" aria-label="Sección">
    <button data-mtab="clase" aria-pressed="${S.mTab !== 'rep'}">Clases</button><button data-mtab="rep" aria-pressed="${S.mTab === 'rep'}">Repertorio</button></div></nav>
  <main class="rep-wrap" id="m-rep" ${S.mTab === 'rep' ? '' : 'hidden'}>${repShellHTML()}</main>
  <main class="maestra" id="m-clases" ${S.mTab === 'rep' ? 'hidden' : ''}>
    <aside class="card roster"><h2>Mis alumnos</h2><div class="roster-list" id="m-roster"></div>
      <form id="m-add"><input type="text" name="n" placeholder="Nombre del nuevo alumno" aria-label="Nombre del nuevo alumno" maxlength="60" required><button class="btn primary small">Agregar</button></form>
    </aside>
    <section class="clase" id="m-clase"></section>
  </main>
  <div class="present" id="present" hidden></div>`;
}
function estadoAlumno(a){
  const niv = nivelDe(a);
  return nivelCompleto(a) ? `Nivel ${niv.n} completo` : `Nivel ${niv.n}, lección ${leccionActual(a)}: ${lec(leccionActual(a), niv.n).titulo}`;
}
function renderMaestraData(){
  if(!$('#m-roster')) return;
  if(S.mTab === 'rep'){ renderRepList(); if(!ED) renderRepMain(); return; }
  const list = Store.alumnos;
  if(!S.maestraSel || !Store.get(S.maestraSel)) S.maestraSel = list[0]?.id || null;
  $('#m-roster').innerHTML = list.length ? list.map(a => `<button class="${a.id === S.maestraSel ? 'on' : ''}" data-msel="${esc(a.id)}"><strong>${esc(a.nombre)}</strong><span>${esc(estadoAlumno(a))}</span></button>`).join('')
    : '<p class="empty">Agrega a tu primer alumno con el campo de abajo.</p>';
  const cont = $('#m-clase');
  const ae = document.activeElement;
  if(ae && cont.contains(ae) && ae.tagName === 'TEXTAREA') return;
  const al = Store.get(S.maestraSel);
  if(!al){ cont.innerHTML = `<div class="card"><h2>Aún no hay alumnos</h2><p class="muted" style="margin-top:8px">Cuando agregues un alumno, la app le crea un código para entrar. Aquí verás en qué lección va y qué sigue en su próxima clase.</p></div>`; return; }
  cont.innerHTML = claseHTML(al);
  wireClase(cont, al);
  if(S.present) renderPresent(true);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-msel]'); if(!b) return; S.maestraSel = b.dataset.msel; S.practica = 0; renderMaestraData(); });
document.addEventListener('submit', async e => {
  if(e.target.id !== 'm-add') return; e.preventDefault();
  const inp = e.target.elements.n; const nombre = inp.value.trim(); if(!nombre) return;
  const btn = $('button', e.target); btn.disabled = true;
  const a = await Store.add(nombre); btn.disabled = false;
  if(a){ inp.value = ''; S.maestraSel = a.id; renderMaestraData(); toast(`${a.nombre} quedó inscrito. Su código para entrar es ${a.codigo}.`); }
});
const PTABS = [{id:'v3d', label:'Violinista 3D'}, {id:'fb', label:'Violín interactivo'}, {id:'sheet', label:'Notas'}, {id:'metro', label:'Metrónomo'}, {id:'tuner', label:'Afinador'}];
function claseHTML(al){
  const niv = nivelDe(al), total = totalDe(al), done = nivelCompleto(al), n = leccionActual(al), L = lec(n, niv.n);
  const est = (al.estrellas || {})[K(al, n)] || 0; const checks = (al.checks || {})[K(al, n)] || [];
  const song = cancionDe(al, n); const songC = catalogo()[song];
  const usaCancion = L.practicas.some(p => p === 'cancion' || p === 'frase');
  const plan = [['Oír', L.oir], ['Tocar', L.tocar], ['Aplicar en la canción', L.aplicar], ['Conoce tu violín', L.capsula], ['Ajuste de postura', L.ajuste]];
  const siguienteNivel = NIVELES.find(x => x.n === niv.n + 1);
  const next = n < total ? lec(n + 1, niv.n) : null;
  const txtAvanzar = n < total ? `Aprobar y pasar a la lección ${n + 1}` : siguienteNivel ? `Aprobar y pasar al Nivel ${siguienteNivel.n}` : `Aprobar y completar el Nivel ${niv.n}`;
  const puedeVolver = (al.leccion || 1) > 1 || niv.n > 1;
  return `<div class="clase-head"><div><h1>Clase con ${esc(al.nombre)}</h1><p>${done ? `Completó el Nivel ${niv.n}.` : `Nivel ${niv.n}, lección ${n} de ${total}.`} Código para entrar: <button class="codechip" data-copy="${esc(al.codigo)}" title="Copiar código">${esc(al.codigo)}</button></p></div>
    <button class="btn gold" data-present="v3d">Presentar en la videollamada</button></div>
  <div class="tool-shortcuts">${PTABS.map(t => `<button class="btn small" data-present="${t.id}">${t.label}</button>`).join('')}</div>
  <div class="clase-grid">
    <div>
      <div class="card today"><h3>${done ? 'Última lección del nivel' : 'Hoy toca'}</h3>
        <div class="t-title">Lección ${n}: ${esc(L.titulo)}</div>
        <p class="t-mision">${esc(L.mision)}</p>
        <ul class="plan">${plan.map(([t, d], i) => `<li class="${checks.includes(i) ? 'done' : ''}"><label><input type="checkbox" data-check="${i}" ${checks.includes(i) ? 'checked' : ''}><span><b>${t}</b>${esc(d)}</span></label></li>`).join('')}</ul>
        <div class="next-up"><strong>Se completa cuando:</strong> ${esc(L.desbloqueo)}<br><strong>Después sigue:</strong> ${next ? `lección ${next.n}, ${esc(next.titulo)}.` : siguienteNivel ? `el Nivel ${siguienteNivel.n}.` : 'el siguiente nivel (todavía no está cargado en la app).'}</div>
      </div>
      <div class="card"><h3>Evaluar la lección</h3>
        <div class="starpick">${[[1, 'Lo toca de principio a fin'], [2, 'Con pulso constante'], [3, 'Buen sonido y afinación']].map(([k, t]) => `<button data-star="${k}" class="${est === k ? 'on' : ''}" aria-pressed="${est === k}"><b>${'★'.repeat(k)}</b><span>${t}</span></button>`).join('')}</div>
        <p class="fine" style="margin:10px 0 14px">Con una estrella ya puede avanzar. Puede volver a esta lección para ganar más estrellas.</p>
        <div class="row">${!done ? `<button class="btn primary" data-advance>${txtAvanzar}</button>` : ''}${puedeVolver ? `<button class="btn ghost" data-back>Regresar una lección</button>` : ''}</div>
      </div>
    </div>
    <div>
      <div class="card"><h3>Canción para esta lección</h3>
        ${usaCancion ? `<label class="field">Elige una canción que ${esc(al.nombre)} ya conozca<select data-song>${ordenCatalogo().map(id => [id, catalogo()[id]]).map(([id, c]) => `<option value="${esc(id)}" ${id === song ? 'selected' : ''}>${esc(c.titulo)}</option>`).join('')}</select></label>
        <div class="row" style="margin-top:12px"><button class="btn small" data-song-pdf="${esc(song)}">Descargar el PDF de «${esc(songC.titulo)}»</button></div>`
        : `<p class="muted">Esta lección se trabaja con ejercicios. La canción de la lección anterior sigue disponible para repasar.</p>`}
      </div>
      <div class="card"><h3>Notas para la próxima clase</h3><p class="fine" style="margin-bottom:8px">Solo las ve la maestra.</p><textarea data-notes placeholder="Lo que quieres recordar de ${esc(al.nombre)}">${esc(al.notas || '')}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn danger small" data-remove>Quitar a ${esc(al.nombre)} del club</button></div>
      </div>
    </div>
  </div>`;
}
function wireClase(root, al){
  const n = leccionActual(al), k = K(al, n), total = totalDe(al), niv = nivelDe(al);
  $$('[data-check]', root).forEach(c => c.onchange = () => {
    const cur = new Set(((al.checks || {})[k]) || []); c.checked ? cur.add(+c.dataset.check) : cur.delete(+c.dataset.check);
    Store.update(al.id, {checks:{...(al.checks || {}), [k]:[...cur]}});
  });
  $$('[data-star]', root).forEach(b => b.onclick = () => Store.update(al.id, {estrellas:{...(al.estrellas || {}), [k]:+b.dataset.star}}));
  const adv = $('[data-advance]', root);
  if(adv) adv.onclick = () => {
    if(!((al.estrellas || {})[k] > 0)){ toast('Marca al menos una estrella antes de aprobar la lección.'); return; }
    const nombre = al.nombre;
    if(n < total){ Store.update(al.id, {leccion:n + 1}); toast(`${nombre} pasó a la lección ${n + 1}.`); return; }
    const sig = NIVELES.find(x => x.n === niv.n + 1);
    if(sig){ Store.update(al.id, {nivel:sig.n, leccion:1}); toast(`${nombre} pasó al Nivel ${sig.n}.`); }
    else { Store.update(al.id, {leccion:total + 1}); toast(`${nombre} completó el Nivel ${niv.n}.`); }
  };
  const back = $('[data-back]', root);
  if(back) back.onclick = () => {
    if(nivelCompleto(al)) Store.update(al.id, {leccion:total});
    else if((al.leccion || 1) > 1) Store.update(al.id, {leccion:al.leccion - 1});
    else if(niv.n > 1){ const prev = nivelObj(niv.n - 1); Store.update(al.id, {nivel:prev.n, leccion:prev.lecciones.length}); }
  };
  const songSel = $('[data-song]', root);
  if(songSel) songSel.onchange = () => Store.update(al.id, {canciones:{...(al.canciones || {}), [k]:songSel.value}});
  $$('[data-song-pdf]', root).forEach(b => b.onclick = () => descargarCancion(b.dataset.songPdf, b));
  const cp = $('[data-copy]', root);
  if(cp) cp.onclick = async () => { try{ await navigator.clipboard.writeText(cp.dataset.copy); toast('Código copiado.'); }catch(e){ toast(`El código de ${al.nombre} es ${cp.dataset.copy}.`); } };
  const notes = $('[data-notes]', root);
  let nt = 0;
  notes.oninput = () => { clearTimeout(nt); nt = setTimeout(() => Store.update(al.id, {notas:notes.value}), 1200); };
  notes.onblur = () => { clearTimeout(nt); if(notes.value !== (al.notas || '')) Store.update(al.id, {notas:notes.value}); };
  $('[data-remove]', root).onclick = () => { if(confirm(`¿Quitar a ${al.nombre} del club? Se borrará su progreso de la hoja.`)){ Store.remove(al.id); S.maestraSel = null; } };
  $$('[data-present]', root).forEach(b => b.onclick = () => openPresent(b.dataset.present));
}

let ED = null, repSel = null, edAlter = false;

function normalizar(c){
  const frases = (c.frases || []).map(f => (f.notas || []).map(n => [+n[0], +n[1]]));
  return {titulo:c.titulo || 'Sin nombre', origen:c.origen || '', porque:c.porque || '', nivel:+c.nivel || 1, leccion:c.leccion ? +c.leccion : null,
    lecciones:`Nivel ${+c.nivel || 1}${c.leccion ? `, lección ${c.leccion}` : ''}`, propia:true, compas:4, frases,
    letras:(c.frases || []).map(f => f.letra || ''), igual:(c.frases || []).map(f => Number.isInteger(f.igual) ? f.igual : null)};
}
function catalogo(){
  const o = {};
  ORDEN_CANCIONES.forEach(id => o[id] = CANCIONES[id]);
  Object.entries(Store.repertorio || {}).forEach(([id, c]) => { if(!o[id]) o[id] = normalizar(c); });
  return o;
}
function ordenCatalogo(){
  const propias = Object.keys(Store.repertorio || {}).filter(id => !CANCIONES[id]).sort((a, b) => (Store.repertorio[a].titulo || '').localeCompare(Store.repertorio[b].titulo || ''));
  return [...ORDEN_CANCIONES, ...propias];
}
const beatsOf = fr => fr.reduce((a, n) => a + n[1], 0);
const fmtBeats = b => (Math.round(b * 2) / 2).toString().replace('.', ',');

/* ---- lista y vista previa ---- */
function repShellHTML(){
  return `<div class="rep">
    <aside class="card roster"><h2>Repertorio</h2>
      <p class="fine" style="margin:0 6px 12px">Canciones en formato de tarjetas, para los niveles en los que el alumno todavía no lee partitura.</p>
      <div class="roster-list" id="rep-list"></div>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><button class="btn primary" data-rnew>Crear canción nueva</button></div>
    </aside>
    <section id="rep-main"></section>
  </div>`;
}
function renderRepList(){
  const el = $('#rep-list'); if(!el) return;
  const cat = catalogo();
  el.innerHTML = ordenCatalogo().map(id => { const c = cat[id]; return `<button class="${repSel === id && !ED ? 'on' : ''}" data-rsel="${esc(id)}"><strong>${esc(c.titulo)}</strong><span>${c.propia ? 'Creada por el club' : 'Repertorio base'}, ${esc(c.lecciones)}</span></button>`; }).join('');
}
function renderRepMain(){
  const el = $('#rep-main'); if(!el) return;
  if(ED){ el.innerHTML = editorHTML(); wireEditor(el); return; }
  const cat = catalogo();
  if(!repSel || !cat[repSel]){
    el.innerHTML = `<div class="card"><h2>Tu repertorio</h2><p class="muted" style="margin-top:8px;max-width:60ch">Elige una canción para verla, o crea una nueva. Las canciones que guardes aparecen en el panel de clases para asignarlas a cualquier alumno, y el alumno puede descargarlas en PDF para imprimir.</p><div class="row" style="margin-top:16px"><button class="btn primary" data-rnew>Crear canción nueva</button></div></div>`;
    return;
  }
  const c = cat[repSel];
  const ej = {frases:c.frases, letras:c.letras, igual:c.igual || c.frases.map(() => null), notas:c.frases.flat()};
  const enUso = Store.alumnos.filter(a => Object.values(a.canciones || {}).includes(repSel)).map(a => a.nombre);
  el.innerHTML = `<div class="card">
    <div class="lesson-head"><div><div class="kicker">${c.propia ? 'Creada por el club' : 'Repertorio base'}</div><h2>${esc(c.titulo)}</h2></div>
      <div class="row">${c.propia ? `<button class="btn" data-redit>Editar</button>` : `<button class="btn" data-rdup>Duplicar y editar</button>`}</div></div>
    <p class="muted" style="margin-top:8px">${esc([c.origen, c.lecciones].filter(Boolean).join('. '))}${c.porque ? `. ${esc(c.porque)}` : ''}</p>
    ${enUso.length ? `<p class="fine" style="margin-top:6px">La están tocando: ${esc(enUso.join(', '))}.</p>` : ''}
    <div class="notes-scroll">${notesHTML(ej)}</div>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn primary" data-rplay>Escuchar</button><button class="btn" data-song-pdf="${esc(repSel)}">Descargar PDF</button></div>
      ${c.propia ? `<button class="btn danger small" data-rdel>Borrar del repertorio</button>` : ''}
    </div>
  </div>`;
  const pb = $('[data-rplay]', el);
  pb.onclick = () => { if(pb.dataset.on){ stopPlay(); return; } pb.dataset.on = '1'; pb.textContent = 'Detener';
    playSeq(ej.notas, 76, i => { $$('.nc.playing', el).forEach(x => x.classList.remove('playing')); $(`.nc[data-i="${i}"]`, el)?.classList.add('playing'); }, () => { delete pb.dataset.on; pb.textContent = 'Escuchar'; }); };
  $('[data-song-pdf]', el).onclick = e => descargarCancion(repSel, e.currentTarget);
  const ed = $('[data-redit]', el); if(ed) ed.onclick = () => abrirEditor(repSel, false);
  const du = $('[data-rdup]', el); if(du) du.onclick = () => abrirEditor(repSel, true);
  const del = $('[data-rdel]', el); if(del) del.onclick = () => {
    if(!confirm(`¿Borrar «${c.titulo}» del repertorio?${enUso.length ? ` ${enUso.join(', ')} la tiene asignada y volverá a su canción sugerida.` : ''}`)) return;
    Store.deleteCancion(repSel); repSel = null; renderRepList(); renderRepMain(); toast('Canción borrada del repertorio.');
  };
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-mtab]');
  if(t){
    if(S.mTab === 'rep' && t.dataset.mtab !== 'rep' && ED?.dirty && !confirm('Tienes cambios sin guardar en la canción. ¿Salir de todos modos?')) return;
    if(t.dataset.mtab !== 'rep') ED = null;
    S.mTab = t.dataset.mtab; stopPlay(); closePresent();
    $$('[data-mtab]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    $('#m-rep').hidden = S.mTab !== 'rep'; $('#m-clases').hidden = S.mTab === 'rep';
    if(S.mTab === 'rep'){ renderRepList(); renderRepMain(); } else renderMaestraData();
    return;
  }
  const r = e.target.closest('[data-rsel]');
  if(r){ if(ED?.dirty && !confirm('Tienes cambios sin guardar en la canción. ¿Salir de todos modos?')) return; ED = null; stopPlay(); repSel = r.dataset.rsel; renderRepList(); renderRepMain(); return; }
  if(e.target.closest('[data-rnew]')){ if(ED?.dirty && !confirm('Tienes cambios sin guardar en la canción. ¿Salir de todos modos?')) return; abrirEditor(null); }
});

/* ---- editor ---- */
function abrirEditor(id, duplicar){
  stopPlay();
  if(!id){ ED = {id:null, titulo:'', origen:'', porque:'', nivel:1, leccion:'', frases:[{letra:'', notas:[], igual:null}], af:0, sel:null, dur:1, dirty:false}; }
  else {
    const c = catalogo()[id];
    ED = {id: duplicar ? null : id, titulo: duplicar ? `${c.titulo} (versión del club)` : c.titulo, origen:c.origen || '', porque:c.porque || c.por_que || '', nivel:c.nivel || 1, leccion:c.leccion || '',
      frases:c.frases.map((f, k) => ({letra:c.letras?.[k] || '', notas:f.map(n => [...n]), igual:c.igual?.[k] ?? null})), af:0, sel:null, dur:1, dirty:!!duplicar};
  }
  renderRepList(); renderRepMain();
  $('#rep-main')?.scrollIntoView({block:'start', behavior:'auto'});
}
function notasDeFrase(k){ const f = ED.frases[k]; return f.igual != null && ED.frases[f.igual] ? ED.frases[f.igual].notas : f.notas; }
function palBtn(m){ const p = posFor(m); const suf = m < 60 ? 'grave' : m >= 72 ? 'agudo' : ''; return `<button class="pal" data-pm="${m}" style="--c:${STR[p.cuerda].color}" title="${noteName(m)}${suf ? ' ' + suf : ''}: cuerda ${STR[p.cuerda].nombre}, ${p.off === 0 ? 'al aire' : 'dedo ' + p.dedo}"><b>${noteName(m)}</b><small>${suf || '&nbsp;'}</small><i>${p.dedoCorto}</i></button>`; }
function editorHTML(){
  return `<div class="card editor">
    <div class="lesson-head"><div><div class="kicker">Editor de canciones</div><h2>${ED.id ? 'Editar canción' : 'Nueva canción'}</h2></div>
      <div class="row"><button class="btn ghost" data-ecancel>Cancelar</button><button class="btn primary" data-esave>Guardar en el repertorio</button></div></div>
    <div class="ed-fields">
      <label class="field">Nombre de la canción<input type="text" data-ef="titulo" maxlength="80" value="${esc(ED.titulo)}" placeholder="Por ejemplo: Arroz con leche"></label>
      <label class="field">Autor u origen<input type="text" data-ef="origen" maxlength="80" value="${esc(ED.origen)}" placeholder="Canción tradicional"></label>
      <label class="field">Nivel<select data-ef="nivel">${Array.from({length:NIVELES_TARJETAS}, (_, i) => `<option value="${i + 1}" ${+ED.nivel === i + 1 ? 'selected' : ''}>Nivel ${i + 1}</option>`).join('')}</select></label>
      <label class="field">Lección sugerida<select data-ef="leccion"><option value="">Cualquier lección</option>${nivelObj(ED.nivel).lecciones.map(L => `<option value="${L.n}" ${+ED.leccion === L.n ? 'selected' : ''}>Lección ${L.n}: ${esc(L.titulo)}</option>`).join('')}</select></label>
      <label class="field ed-wide">Por qué esta canción (el alumno lo lee en su hoja)<input type="text" data-ef="porque" maxlength="180" value="${esc(ED.porque)}" placeholder="Por ejemplo: tiene muchas notas repetidas, ideal para el arco."></label>

    <div class="ed-selbar" data-eselbar></div>
    <div class="ed-phrases" data-ephrases></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-eaddf>Añadir frase</button><button class="btn" data-eplay>Escuchar la canción</button><button class="btn" data-epdf>Descargar PDF de prueba</button></div>
    <div data-ewarn></div>
  </div>`;
}
function renderEdPhrases(root){
  root = root || $('#rep-main');
  const box = $('[data-ephrases]', root); if(!box) return;

        <span class="fine ed-beats${b % 4 ? ' odd' : ''}">${fmtBeats(b)} pulsos</span>
        ${k > 0 ? `<select data-eigual="${k}" aria-label="Tipo de frase"><option value="">Frase nueva</option>${ED.frases.slice(0, k).map((_, j) => ED.frases[j].igual == null ? `<option value="${j}" ${f.igual === j ? 'selected' : ''}>Igual que la frase ${j + 1}</option>` : '').join('')}</select>` : ''}
        ${ED.frases.length > 1 ? `<button class="btn ghost small" data-edelf="${k}">Borrar frase</button>` : ''}
      </div>
      <div class="phr-cards ed-cards">${cards}${!rep ? `<span class="ed-empty">${notas.length ? '' : 'Marca esta frase y toca notas arriba para llenarla.'}</span>` : ''}</div>
    </div>`;
  }).join('');
  const bar = $('[data-eselbar]', root);
  if(ED.sel){ const [m, d] = ED.frases[ED.sel.f].notas[ED.sel.i]; bar.innerHTML = `<span><strong>Nota seleccionada:</strong> ${noteName(m)}, ${RITMO[d]}. Toca otra nota o duración para cambiarla.</span><div class="row"><button class="btn small" data-emove="-1" aria-label="Mover a la izquierda">Mover ←</button><button class="btn small" data-emove="1" aria-label="Mover a la derecha">Mover →</button><button class="btn small" data-eins>Insertar una nota antes</button><button class="btn small danger" data-edeln>Borrar nota</button><button class="btn small ghost" data-eunsel>Listo</button></div>`; bar.hidden = false; }
  else { bar.hidden = true; bar.innerHTML = ''; }
  $$('[data-ed]', root).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.ed === ED.dur)));
  renderEdWarn(root);
}
function renderEdWarn(root){
  const w = $('[data-ewarn]', root); if(!w) return;

  const impares = ED.frases.map((_, k) => beatsOf(notasDeFrase(k))).map((b, k) => b && b % 4 ? k + 1 : 0).filter(Boolean);
  if(impares.length) msgs.push(`Las frases ${impares.join(', ')} no completan compases de 4 pulsos. No es un error si la canción está en 3 o si empieza con anacrusa.`);
