/* ============ ritmo del club ============
   Células y sílabas de la herramienta de ritmo del club.
   d = duración de cada nota en pulsos; r = qué notas son silencio. */
const CELULAS = {
  pan:{syl:['pan'], d:[1], nombre:'Un pulso'},
  luna:{syl:['lu','na'], d:[.5,.5], nombre:'Dos en un pulso'},
  bla2:{syl:['1 - 2'], d:[2], nombre:'Nota de dos pulsos'},
  leey:{syl:['Le-e','y'], d:[1.5,.5], nombre:'Nota que se estira'},
  s4:{syl:['pan'], d:[1], r:[1], nombre:'Silencio: pan por dentro'},
  red:{syl:['1 - 2 - 3 - 4'], d:[4], nombre:'Nota de cuatro pulsos'},
  bla3:{syl:['1 - 2 - 3'], d:[3], nombre:'Nota de tres pulsos'},
  choco:{syl:['cho','co','la','te'], d:[.25,.25,.25,.25], nombre:'Cuatro en un pulso'},
  gran:{syl:['grán','chi','co'], d:[.5,.25,.25], nombre:'Larga y dos cortas'},
  cama:{syl:['ca','ma','rón'], d:[.25,.25,.5], nombre:'Dos cortas y larga'},
  s2:{syl:['1 - 2'], d:[2], r:[1], nombre:'Silencio de dos pulsos'}
};
const durCel = id => CELULAS[id].d.reduce((a, b) => a + b, 0);
const JUEGOS = {eco:{nombre:'Eco', rondas:5}, cual:{nombre:'¿Cuál sonó?', rondas:8}, completa:{nombre:'Completa el compás', rondas:6}};
const azar = arr => arr[Math.floor(Math.random() * arr.length)];
const barajar = arr => { const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* cartas que el alumno ya tiene hasta esa lección */
function celulasHasta(nivel, n){
  const ids = [];
  NIVELES.filter(nv => nv.n <= nivel).forEach(nv => nv.lecciones.forEach(L => {
    if((nv.n < nivel || L.n <= n) && L.ritmo?.nueva && !ids.includes(L.ritmo.nueva)) ids.push(L.ritmo.nueva);
  }));
  return ids.length ? ids : ['pan'];
}
/* un compás de 4 pulsos con las cartas disponibles; incluye la carta nueva si la hay */
function compasAzar(pool, nueva){
  for(let intento = 0; intento < 30; intento++){
    const cel = []; let resto = 4;
    if(nueva && Math.random() < .8){ cel.push(nueva); resto -= durCel(nueva); }
    while(resto > 1e-6){
      const cand = pool.filter(id => durCel(id) <= resto + 1e-6); if(!cand.length) break;
      const id = azar(cand); cel.push(id); resto -= durCel(id);
    }
    if(resto > 1e-6) continue;
    const suenan = cel.flatMap(id => CELULAS[id].d.filter((_, i) => !CELULAS[id].r?.[i])).length;
    if(suenan >= Math.min(2, cel.length)) return barajar(cel);
  }
  return ['pan', 'pan', 'pan', 'pan'];
}
function eventosDe(cels){
  const ev = []; let t = 0;
  cels.forEach((id, ci) => { const c = CELULAS[id]; c.d.forEach((d, ni) => { ev.push({t, d, r:!!c.r?.[ni], ci, ni}); t += d; }); });
  return ev;
}
function cartaRitmo(id, {tag = 'div', cls = '', attrs = '', oculta = false} = {}){
  const c = CELULAS[id], fig = (Store.alumno?.nivel || 1) >= 3 && !oculta ? notacionCelula(id) : '';
  const notas = c.d.map((d, i) => `<span class="rc-n${c.r?.[i] ? ' rest' : ''}" style="--d:${d}">${oculta ? '' : esc(c.syl[i])}</span>`).join('');
  return `<${tag} class="rc ${cls}" ${attrs} aria-label="${esc(c.syl.join(' '))}${c.r ? ' (silencio)' : ''}">${fig}<span class="rc-notes">${notas}</span></${tag}>`;
}

/* sonidos del ritmo */
function golpe(when){
  const c = audio(); const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(820, when); o.frequency.exponentialRampToValueAtTime(420, when + .08);
  g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(.5, when + .004); g.gain.exponentialRampToValueAtTime(.0001, when + .16);
  o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + .18);
}
function clickSuave(when){
  const c = audio(); const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = 1040;
  g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(.035, when + .002); g.gain.exponentialRampToValueAtTime(.0001, when + .04);
  o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + .05);
}
function sfx(ok){
  const c = audio(); let w = c.currentTime + .01;
  (ok ? [[76,.08],[83,.18]] : [[48,.24]]).forEach(([m, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = ok ? 'triangle' : 'sawtooth'; o.frequency.value = mtof(m);
    g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(ok ? .22 : .06, w + .01); g.gain.exponentialRampToValueAtTime(.0001, w + d);
    o.connect(g); g.connect(c.destination); o.start(w); o.stop(w + d + .02); w += d * .75;
  });
}
/* temporizador ligado al reloj de audio, fácil de cancelar */
function reloj(){
  const ts = [];
  return {at(sec, fn){ ts.push(setTimeout(fn, Math.max(0, (sec - audio().currentTime) * 1000))); }, clear(){ ts.forEach(clearTimeout); ts.length = 0; }};
}
/* toca células con cuenta previa y pulso suave; onNota recibe cada nota a tiempo */
function tocarCelulas(cels, bpm, {previa = 4, rel = null, onNota = null} = {}){
  const c = audio(), spb = 60 / bpm, t0 = c.currentTime + .15;
  for(let b = 0; b < previa; b++) click(t0 + b * spb, b === 0);
  const ini = t0 + previa * spb, ev = eventosDe(cels);
  const tot = ev.reduce((a, e) => Math.max(a, e.t + e.d), 0);
  for(let b = 0; b < tot; b++) clickSuave(ini + b * spb);
  ev.forEach((e, i) => { const w = ini + e.t * spb; if(!e.r) golpe(w); if(rel && onNota) rel.at(w, () => onNota(i, e)); });
  if(rel && onNota) rel.at(ini + tot * spb, () => onNota(-1, null));
  return {ini, fin:ini + tot * spb, spb, ev};
}

/* avance del alumno: se guarda en su fila de la hoja (columna progreso) */
function guardarJuego(alId, clave, est){
  const al = Store.alumno; if(!al || al.id !== alId) return;
  const p = progresoDe(al); p.juegos[clave] = Math.max(p.juegos[clave] || 0, est); sumarSemana(p, est); guardarProgreso();
}
function mejorJuego(alId, clave){ const al = Store.get(alId); return al ? (progresoDe(al).juegos[clave] || 0) : 0; }
function marcarPractica(alId){
  const al = Store.alumno; if(!al || al.id !== alId) return;
  const p = progresoDe(al), hoy = hoyStr();
  if(!p.dias.includes(hoy)){ p.dias.push(hoy); if(p.dias.length > 400) p.dias = p.dias.slice(-400); sumarSemana(p, 0, 1); }
  sumarSemana(p, 10); guardarProgreso();
}

  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}
const estrellasGrandes = n => `<div class="g-stars" aria-label="${n} de 3 estrellas">${[1,2,3].map(k => `<span class="${k <= n ? '' : 'off'}">★</span>`).join('')}</div>`;

/* ============ juegos de ritmo ============ */
let latencia = (() => { try{ return +localStorage.getItem('sprinkloud-latencia') || .06; }catch(e){ return .06; } })();
function mountJuego(el, {tipo, pool, nueva = null, bpm = 66, alId = null, clave = '', onFin = null, notasPool = null, notasCancion = null}){
  if(JUEGOS[tipo]?.notas) return mountJuegoNotas(el, {tipo, pool:notasPool || NATURALES, notasCancion, alId, clave, onFin});
  if(!JUEGOS[tipo]) tipo = 'eco';
  if(tipo !== 'eco' && pool.length < 2) tipo = 'eco';
  const J = JUEGOS[tipo], rel = reloj();
  let ronda = 0, aciertos = 0, combo = 0, puntos = 0, resultados = [], bloq = false;
  el.innerHTML = `<div class="game">
    <div class="g-head"><strong>${J.nombre}</strong><div class="g-dots">${Array.from({length:J.rondas}, () => '<i></i>').join('')}</div><span class="g-pts">0 pts</span></div>
    <p class="g-combo" aria-live="polite"></p>
    <div class="g-area"></div>
    <p class="g-msg" aria-live="polite"></p>
    <div class="g-opts"></div>
    <div class="row g-ctrl" style="justify-content:center"></div>
  </div>`;
  const area = $('.g-area', el), msg = $('.g-msg', el), opts = $('.g-opts', el), ctrl = $('.g-ctrl', el), dots = $$('.g-dots i', el), comboEl = $('.g-combo', el);
  const pinta = () => {
    dots.forEach((d, i) => d.className = i < resultados.length ? (resultados[i] ? 'ok' : 'bad') : i === ronda ? 'cur' : '');
    $('.g-pts', el).textContent = `${puntos} pts`;
    comboEl.textContent = combo >= 3 ? `¡Combo x${combo}!` : '';
  };
  const responder = ok => {
    sfx(ok); resultados.push(ok);
    if(ok){ aciertos++; combo++; puntos += combo >= 5 ? 20 : 10; } else combo = 0;
    pinta();
    rel.at(audio().currentTime + (ok ? 1.2 : 2.2), () => { ronda++; ronda < J.rondas ? pregunta() : fin(); });
  };
  const oirBtn = fn => { ctrl.innerHTML = '<button class="btn" data-g-oir>Escuchar otra vez</button>'; $('[data-g-oir]', ctrl).onclick = fn; };

  function preguntaCual(){
    const objetivo = nueva && pool.includes(nueva) && Math.random() < .4 ? nueva : azar(pool);
    const cartas = barajar([objetivo, ...barajar(pool.filter(id => id !== objetivo)).slice(0, 2)]);
    area.innerHTML = '<p class="pr-title" aria-hidden="true">?</p>';
    msg.textContent = 'Escucha y elige la carta';
    opts.innerHTML = cartas.map(id => cartaRitmo(id, {tag:'button', attrs:`data-g-op="${id}"`})).join('');
    const oir = () => { rel.clear(); tocarCelulas([objetivo], bpm, {previa:2}); };
    oirBtn(oir); oir();
    $$('[data-g-op]', opts).forEach(b => b.onclick = () => {
      if(bloq) return; bloq = true; const ok = b.dataset.gOp === objetivo;
      b.classList.add(ok ? 'ok' : 'bad'); if(!ok) $(`[data-g-op="${objetivo}"]`, opts).classList.add('ok');
      msg.textContent = ok ? '¡Sí!' : 'Era esta'; ctrl.innerHTML = ''; responder(ok);
    });
  }

  function preguntaCompleta(){
    const cels = compasAzar(pool, nueva), h = Math.floor(Math.random() * cels.length), obj = cels[h];
    const mismas = pool.filter(id => id !== obj && Math.abs(durCel(id) - durCel(obj)) < 1e-6);
    const otras = barajar(mismas.length ? mismas : pool.filter(id => id !== obj)).slice(0, 2);
    const barra = lleno => area.innerHTML = `<div class="bar-row">${cels.map((id, i) => i === h && !lleno ? `<div class="rc q"><span class="rc-notes"><span class="rc-n" style="--d:${durCel(obj)}">?</span></span></div>` : cartaRitmo(id, {cls:i === h ? 'ok' : ''})).join('')}</div>`;
    barra(false);
    msg.textContent = '¿Qué carta falta?';
    opts.innerHTML = barajar([obj, ...otras]).map(id => cartaRitmo(id, {tag:'button', attrs:`data-g-op="${id}"`})).join('');
    const oir = () => { rel.clear(); tocarCelulas(cels, bpm, {previa:4, rel, onNota:(i, e) => $$('.bar-row > .rc', area).forEach((r, k) => r.classList.toggle('now', !!e && k === e.ci))}); };
    oirBtn(oir); oir();
    $$('[data-g-op]', opts).forEach(b => b.onclick = () => {
      if(bloq) return; bloq = true; const ok = b.dataset.gOp === obj;
      b.classList.add(ok ? 'ok' : 'bad'); if(!ok) $(`[data-g-op="${obj}"]`, opts).classList.add('ok');
      rel.clear(); barra(true); msg.textContent = ok ? '¡Completo!' : 'Faltaba esta'; ctrl.innerHTML = ''; responder(ok);
    });
  }

  function preguntaEco(){
    const cels = compasAzar(pool, nueva), ev = eventosDe(cels), esperados = ev.filter(e => !e.r);
    area.innerHTML = `<div class="beat-dots" aria-hidden="true">${'<span></span>'.repeat(4)}</div><div class="bar-row eco-cartas">${cels.map(id => cartaRitmo(id, {oculta:true, cls:'hid'})).join('')}</div>`;
    msg.textContent = 'Escucha el ritmo y repítelo tocando aquí o cualquier tecla';
    opts.innerHTML = '<button class="btn primary big" data-g-go>▶ Escuchar</button>';
    ctrl.innerHTML = '<button class="pad" data-g-pad disabled>Toca aquí</button>';
    const pad = $('[data-g-pad]', ctrl), bd = $$('.beat-dots span', area);
    let taps = [], ventana = null;
    const pulso = (b, tuyo) => bd.forEach((d, i) => { d.classList.toggle('on', i === b); d.classList.toggle('you', !!tuyo); });
    const golpeTu = e => {
      e?.preventDefault?.(); if(pad.disabled || !ventana) return;
      taps.push(audio().currentTime - latencia);
      pad.classList.add('tap'); setTimeout(() => pad.classList.remove('tap'), 90);
      pad.textContent = `${taps.filter(t => t > ventana.ini - .35).length} ♪`;
    };
    pad.addEventListener('pointerdown', golpeTu);
    area.addEventListener('pointerdown', golpeTu);
    const evaluar = () => {
      pad.disabled = true; pulso(-1);
      const {ini, spb} = ventana, tol = Math.min(.26, spb * .36);
      const esp = esperados.map(e => ini + e.t * spb);
      let libres = taps.filter(t => t > ini - .35 && t < ini + 4 * spb + .35);
      // compensa el retraso de este equipo (audífonos, pantalla, teclado) con la mediana de la diferencia
      const difs = libres.map(t => esp.reduce((b, w) => Math.abs(t - w) < Math.abs(b) ? t - w : b, 9)).filter(d => Math.abs(d) < .4).sort((a, b) => a - b);

      });

      rel.at(t0, () => msg.textContent = '1, 2, 3, 4…');

      ventana = {ini:t0 + 12 * spb, spb};

    };
  }

  const preguntas = {eco:preguntaEco, cual:preguntaCual, completa:preguntaCompleta};

const NATURALES = [55,57,59,60,62,64,65,67,69,71,72,74,76,77,79,81,83];
function notasHasta(nivel, n){
  if(nivel > 3) return nivel >= 4 ? [...NATURALES, 61, 66, 68, 73, 78] : NATURALES;
  if(nivel < 3) return [62, 64, 66, 67, 69, 71, 73, 74];
  const lineas = [64, 67, 71, 74, 77], espacios = [65, 69, 72, 76], extra = [60, 62, 59, 57, 55, 79, 81];
  return n <= 1 ? lineas : n === 2 ? [...lineas, ...espacios] : n === 3 ? [...lineas, ...espacios, ...extra] : NATURALES;
}

const bemolSVG = (x, y) => `<path d="M${x - 3} ${y - 14}v17c5-2 8-4 8-7s-4-4-8-1" stroke="currentColor" stroke-width="1.7" fill="none"/>`;
const claveSVG = (x, top) => `<path d="${CLAVE_SOL}" transform="translate(${x - 12 * 3} ${top + 30 - 15.2 * 3}) scale(3)" fill="currentColor"/>`;
/* dibuja frases en pentagrama. ej = {frases, compas, anacrusa, letras}; cada nota queda en <g class="pn" data-i> */
function pentagramaHTML(ej, {nombres = true, inicio = 0} = {}){
  const W = 46, compas = ej.compas || 4, ana = ej.anacrusa || 0;
  let idx = inicio, acc = -ana;
  return ej.frases.map((fr, k) => {
    const beats = fr.reduce((a, n) => a + n[1], 0), ancho = Math.max(220, 70 + beats * W + 20), top = 34;
    const y = st => top + 40 - st * 5, x0 = 66;
    let o = `<svg class="penta" viewBox="0 0 ${ancho} 128" width="${ancho}" height="128" role="img" aria-label="Frase ${k + 1} en pentagrama">`;
    for(let l = 0; l < 5; l++) o += `<line x1="4" x2="${ancho - 4}" y1="${top + l * 10}" y2="${top + l * 10}" class="pl"/>`;
    o += claveSVG(24, top);
    let t = 0;
    const tiempos = fr.map(n => { const v = t; t += n[1]; return v; });
    // barras de compás
    const primera = Math.ceil((acc + 1e-6) / compas) * compas;
    for(let bb = primera; bb < acc + beats - 1e-6; bb += compas) o += `<line x1="${x0 + (bb - acc) * W - 8}" x2="${x0 + (bb - acc) * W - 8}" y1="${top}" y2="${top + 40}" class="pl"/>`;
    // grupos con barra (notas de menos de un pulso dentro del mismo pulso)
    const grupo = fr.map(() => -1); let g = 0;
    for(let i = 0; i < fr.length; i++){
      if(fr[i][1] >= 1 || grupo[i] >= 0) continue;
      const pulso = Math.floor(tiempos[i] + acc + 1e-6); let j = i;
      while(j + 1 < fr.length && fr[j + 1][1] < 1 && Math.floor(tiempos[j + 1] + acc + 1e-6) === pulso) j++;
      if(j > i){ for(let q = i; q <= j; q++) grupo[q] = g; g++; }
    }
    const arriba = i => { const gi = grupo[i]; if(gi < 0) return pasoDe(fr[i][0]).st < 4; const sts = fr.map((n, q) => grupo[q] === gi ? pasoDe(n[0]).st : null).filter(v => v != null); return sts.reduce((a, v) => a + v, 0) / sts.length < 4; };
    const puntas = [];
    fr.forEach(([m, d, cu], i) => {
      const {st, acc: alt} = pasoDe(m), x = x0 + tiempos[i] * W, yy = y(st), p = posFor(m, cu), col = STR[p.cuerda].color, up = arriba(i);
      let n = `<g class="pn" data-i="${idx + i}" style="--c:${col}">`;
      for(let s = -2; s >= st; s -= 2) n += `<line x1="${x - 11}" x2="${x + 11}" y1="${y(s)}" y2="${y(s)}" class="pl"/>`;
      for(let s = 10; s <= st; s += 2) n += `<line x1="${x - 11}" x2="${x + 11}" y1="${y(s)}" y2="${y(s)}" class="pl"/>`;
      if(alt === '#') n += `<g style="color:var(--ink)">${sostenidoSVG(x - 15, yy)}</g>`;
      if(alt === 'b') n += `<g style="color:var(--ink)">${bemolSVG(x - 14, yy)}</g>`;
      const hueca = d >= 2 - 1e-6;
      n += `<ellipse class="cab" cx="${x}" cy="${yy}" rx="6.4" ry="4.7" transform="rotate(-20 ${x} ${yy})" fill="${hueca ? 'var(--surface)' : col}" stroke="${col}" stroke-width="${hueca ? 2.4 : 1}"/>`;
      if(d < 4 - 1e-6){ const sx = up ? x + 5.8 : x - 5.8, ey = up ? yy - 32 : yy + 32; n += `<line x1="${sx}" x2="${sx}" y1="${yy}" y2="${ey}" stroke="var(--ink)" stroke-width="1.5"/>`; puntas[i] = [sx, ey, up];
        if(d < 1 && grupo[i] < 0){ const fl = d <= .25 + 1e-6 ? 2 : 1; for(let f = 0; f < fl; f++){ const fy = ey + (up ? f * 7 : -f * 7); n += `<path d="M${sx} ${fy}${up ? 'c7 3 10 9 6 15' : 'c7 -3 10 -9 6 -15'}" stroke="var(--ink)" stroke-width="1.8" fill="none"/>`; } } }
      if([.75, 1.5, 3].some(v => Math.abs(d - v) < 1e-6)) n += `<circle cx="${x + 11}" cy="${yy - (st % 2 === 0 ? 2 : 0)}" r="2" fill="var(--ink)"/>`;
      if(nombres) n += `<text x="${x}" y="${top + 76}" text-anchor="middle" class="pnom" fill="${col}">${noteName(m)}</text><text x="${x}" y="${top + 90}" text-anchor="middle" class="pdedo">${cu && fr[i][3] ? fr[i][3] : p.dedoCorto}</text>`;
      o += n + '</g>';
    });
    // barras de las corcheas
    for(let gi = 0; gi < g; gi++){
      const ids = fr.map((_, q) => q).filter(q => grupo[q] === gi), a = puntas[ids[0]], z = puntas[ids[ids.length - 1]]; if(!a || !z) continue;
      const up = a[2], yb = up ? Math.min(...ids.map(q => puntas[q][1])) : Math.max(...ids.map(q => puntas[q][1]));
      ids.forEach(q => { o += `<line x1="${puntas[q][0]}" x2="${puntas[q][0]}" y1="${puntas[q][1]}" y2="${yb}" stroke="var(--ink)" stroke-width="1.5"/>`; });
      o += `<line x1="${a[0]}" x2="${z[0]}" y1="${yb}" y2="${yb}" stroke="var(--ink)" stroke-width="4.4"/>`;
      ids.forEach((q, k2) => { if(fr[q][1] <= .25 + 1e-6){ const nx = ids[k2 + 1] != null && fr[ids[k2 + 1]][1] <= .25 + 1e-6 ? puntas[ids[k2 + 1]][0] : puntas[q][0] + (k2 === ids.length - 1 ? -8 : 8); o += `<line x1="${puntas[q][0]}" x2="${nx}" y1="${yb + (up ? 7 : -7)}" y2="${yb + (up ? 7 : -7)}" stroke="var(--ink)" stroke-width="4.4"/>`; } });
      if(ids.length === 3 && ids.every(q => Math.abs(fr[q][1] - 1 / 3) < 1e-3)) o += `<text x="${(a[0] + z[0]) / 2}" y="${yb + (up ? -6 : 16)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">3</text>`;
    }
    o += '</svg>';
    idx += fr.length; acc += beats;
    const letra = ej.letras?.[k];
    return `<div class="phr penta-phr"><span class="phr-n">${k + 1}</span><div class="phr-body">${letra ? `<p class="phr-l">${esc(letra)}</p>` : ''}<div class="penta-scroll">${o}</div></div></div>`;
  }).join('');
}
/* partitura de un ejercicio según el nivel: tarjetas, pentagrama o ambos */
function partituraHTML(ej, nivel){
  if(!ej.notas.length) return `<div class="aviso"><div><strong>Falta la partitura de «${esc(ej.titulo || ej.nombre)}»</strong><p>Pídesela a tu maestro por el grupo de WhatsApp del club.</p></div></div>`;

}
/* nota sola en un pentagrama pequeño (juegos y cápsulas) */
function notaSolaSVG(m, {ancho = 200, color = true, dibujos = false} = {}){
  const top = 40, y = st => top + 40 - st * 5, {st, acc} = pasoDe(m), x = ancho / 2 + 20, col = color ? STR[posFor(m).cuerda].color : 'var(--ink)';
  let o = `<svg class="penta nota-sola" viewBox="0 0 ${ancho} 130" role="img" aria-label="Una nota en el pentagrama">`;
  for(let l = 0; l < 5; l++) o += `<line x1="6" x2="${ancho - 6}" y1="${top + l * 10}" y2="${top + l * 10}" class="pl"/>`;
  o += claveSVG(26, top);
  for(let s = -2; s >= st; s -= 2) o += `<line x1="${x - 13}" x2="${x + 13}" y1="${y(s)}" y2="${y(s)}" class="pl"/>`;
  for(let s = 10; s <= st; s += 2) o += `<line x1="${x - 13}" x2="${x + 13}" y1="${y(s)}" y2="${y(s)}" class="pl"/>`;
  if(acc === '#') o += `<g style="color:var(--ink)">${sostenidoSVG(x - 17, y(st))}</g>`;
  if(acc === 'b') o += `<g style="color:var(--ink)">${bemolSVG(x - 16, y(st))}</g>`;
  o += `<ellipse cx="${x}" cy="${y(st)}" rx="7.4" ry="5.4" transform="rotate(-20 ${x} ${y(st)})" fill="${col}"/>`;
  return o + '</svg>';
}
/* notación de una célula de ritmo (niveles 3 en adelante) */
function notacionCelula(id){
  const c = CELULAS[id], W = 34, y = 26; let x = 12, o = '', puntas = [];
  const total = c.d.reduce((a, b) => a + b, 0), ancho = Math.max(40, 24 + c.d.length * W);
  c.d.forEach((d, i) => {
    if(c.r?.[i]){
      if(d >= 2) o += `<rect x="${x - 7}" y="${y - 6}" width="14" height="5" fill="currentColor"/>`;
      else if(d >= 1) o += `<path d="M${x - 3} ${y - 14}l6 7-6 6 6 7" stroke="currentColor" stroke-width="2.6" fill="none"/>`;
      else { o += `<path d="M${x + 3} ${y - 8}l-6 16" stroke="currentColor" stroke-width="1.8"/><circle cx="${x}" cy="${y - 7}" r="2.4" fill="currentColor"/>`; if(d <= .25) o += `<circle cx="${x - 2}" cy="${y - 1}" r="2.4" fill="currentColor"/>`; }
      puntas.push(null);
    } else {
      o += `<ellipse cx="${x}" cy="${y + 6}" rx="5.6" ry="4.2" transform="rotate(-20 ${x} ${y + 6})" fill="${d >= 2 ? 'none' : 'currentColor'}" stroke="currentColor" stroke-width="1.6"/>`;
      if(d < 4) o += `<line x1="${x + 5}" x2="${x + 5}" y1="${y + 6}" y2="${y - 20}" stroke="currentColor" stroke-width="1.5"/>`;
      if([.75, 1.5, 3].some(v => Math.abs(d - v) < 1e-6)) o += `<circle cx="${x + 11}" cy="${y + 6}" r="1.8" fill="currentColor"/>`;
      puntas.push(d < 1 ? x + 5 : null);
    }
    x += W;
  });
  const cortas = puntas.map((p, i) => p != null ? i : -1).filter(i => i >= 0);
  if(cortas.length >= 2){ const a = puntas[cortas[0]], z = puntas[cortas[cortas.length - 1]]; o += `<line x1="${a}" x2="${z}" y1="${y - 20}" y2="${y - 20}" stroke="currentColor" stroke-width="4"/>`;
    cortas.forEach((i, k) => { if(c.d[i] <= .25 + 1e-6){ const b = cortas[k + 1] != null && c.d[cortas[k + 1]] <= .25 + 1e-6 ? puntas[cortas[k + 1]] : puntas[i] + (k === cortas.length - 1 ? -9 : 9); o += `<line x1="${puntas[i]}" x2="${b}" y1="${y - 14}" y2="${y - 14}" stroke="currentColor" stroke-width="4"/>`; } });
    if(c.d.length === 3 && c.d.every(v => Math.abs(v - 1 / 3) < 1e-3)) o += `<text x="${(a + z) / 2}" y="${y - 25}" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">3</text>`;
  } else if(cortas.length === 1){ const px = puntas[cortas[0]]; o += `<path d="M${px} ${y - 20}c7 3 10 9 6 15" stroke="currentColor" stroke-width="1.8" fill="none"/>`; if(c.d[cortas[0]] <= .25) o += `<path d="M${px} ${y - 13}c7 3 10 9 6 15" stroke="currentColor" stroke-width="1.8" fill="none"/>`; }
  return `<svg class="rc-fig" viewBox="0 0 ${ancho} 40" width="${ancho}" height="40" aria-hidden="true">${o}</svg>`;
}

/* ============ MusicXML (exportado desde MuseScore 3) ============ */
function leerMusicXML(texto){
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('El archivo no es un MusicXML válido. En MuseScore: Archivo, Exportar, formato MusicXML (.musicxml).');
  const part = doc.querySelector('score-partwise > part'); if(!part) throw new Error('El archivo no tiene una parte de música. Exporta en formato MusicXML sin comprimir.');
  const titulo = (doc.querySelector('work > work-title')?.textContent || doc.querySelector('movement-title')?.textContent || '').trim();
  const PASO = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
  let div = 1, compas = 4; const medidas = [];
  part.querySelectorAll(':scope > measure').forEach(me => {
    const d = me.querySelector('attributes > divisions'); if(d) div = +d.textContent || 1;
    const b = me.querySelector('attributes > time > beats'), bt = me.querySelector('attributes > time > beat-type');
    if(b && bt) compas = +b.textContent * 4 / +bt.textContent;
    const notas = [];
    me.querySelectorAll(':scope > note').forEach(n => {
      if(n.querySelector('chord') || n.querySelector('grace')) return;
      const dur = Math.round((+(n.querySelector('duration')?.textContent || 0) / div) * 1000) / 1000; if(!dur) return;
      if(n.querySelector('rest')){ notas.push([null, dur]); return; }
      const st = n.querySelector('pitch > step')?.textContent, oc = +n.querySelector('pitch > octave')?.textContent, alt = +(n.querySelector('pitch > alter')?.textContent || 0);
      notas.push([12 * (oc + 1) + PASO[st] + alt, dur, !!n.querySelector('tie[type="stop"]')]);
    });
    medidas.push({notas, compas});
  });
  // une ligaduras y silencios (los silencios alargan la nota anterior)
  const plano = []; medidas.forEach((me, k) => me.notas.forEach(([m, d, lig]) => {
    const prev = plano[plano.length - 1];
    if(m == null){ if(prev) prev[1] += d; return; }
    if(lig && prev && prev[0] === m){ prev[1] += d; return; }
    plano.push([m, d, k]);
  }));
  if(!plano.length) throw new Error('No se encontraron notas en el archivo.');
  const porFrase = compas === 3 ? 8 : 4, frases = [];
  plano.forEach(([m, d, k]) => { const f = Math.floor(k / porFrase); (frases[f] = frases[f] || []).push([m, Math.round(d * 1000) / 1000]); });
  return {titulo, compas:medidas[0]?.compas || 4, frases:frases.filter(Boolean)};
}

/* ============ juegos de notas: pentagrama, oído y lluvia ============ */
function diapasonJuego(){ return `<div class="fb-wrap fb-juego">${fbSVG()}</div>`; }
function mountJuegoNotas(el, {tipo, pool, notasCancion = null, alId = null, clave = '', onFin = null}){
  const J = JUEGOS[tipo], rel = reloj();
  let ronda = 0, aciertos = 0, combo = 0, puntos = 0, resultados = [], objetivo = null, bloq = false;
  el.innerHTML = `<div class="game">
    <div class="g-head"><strong>${J.nombre}</strong><div class="g-dots">${Array.from({length:tipo === 'lluvia' ? 0 : J.rondas}, () => '<i></i>').join('')}</div><span class="g-pts">0 pts</span></div>
    <p class="g-combo" aria-live="polite"></p>
    <div class="g-area"></div>
    <p class="g-msg" aria-live="polite"></p>
    <div class="g-fb">${diapasonJuego()}</div>
    <div class="row g-ctrl" style="justify-content:center"></div>
  </div>`;
  const area = $('.g-area', el), msg = $('.g-msg', el), ctrl = $('.g-ctrl', el), dots = $$('.g-dots i', el), comboEl = $('.g-combo', el);
  $$('.g-fb .dot', el).forEach(d => d.classList.add('on'));
  const pinta = () => { dots.forEach((d, i) => d.className = i < resultados.length ? (resultados[i] ? 'ok' : 'bad') : i === ronda ? 'cur' : ''); $('.g-pts', el).textContent = `${puntos} pts`; comboEl.textContent = combo >= 3 ? `¡Combo x${combo}!` : ''; };
  const marcarDot = (m, cls) => { $$(`.g-fb .dot[data-m="${m}"]`, el).forEach(d => { d.classList.add(cls); setTimeout(() => d.classList.remove(cls), 900); }); };
  const fin = () => {
    rel.clear(); const total = tipo === 'lluvia' ? resultados.length : J.rondas;
    const pct = total ? aciertos / total : 0, est = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
    if(alId) guardarJuego(alId, clave, est);
    comboEl.textContent = ''; msg.textContent = '';
    area.innerHTML = `<div class="g-end">${estrellasGrandes(est)}<p class="pr-title">${est === 3 ? '¡Perfecto!' : est === 2 ? '¡Muy bien!' : '¡Lo lograste!'}</p><p class="muted">${aciertos} de ${total} · ${puntos} puntos</p></div>`;
    ctrl.innerHTML = `<button class="btn" data-g-otra>Jugar otra vez</button>${onFin ? '<button class="btn primary big" data-g-fin>Seguir</button>' : ''}`;
    if(est >= 2) confeti();
    $('[data-g-otra]', ctrl).onclick = () => { ronda = 0; aciertos = 0; combo = 0; puntos = 0; resultados = []; inicio(); };
    const f = $('[data-g-fin]', ctrl); if(f) f.onclick = () => onFin(est);
  };
  const acierto = ok => { sfx(ok); resultados.push(ok); if(ok){ aciertos++; combo++; puntos += combo >= 5 ? 20 : 10; } else combo = 0; pinta(); };
  const siguiente = ok => rel.at(audio().currentTime + (ok ? 1 : 1.8), () => { ronda++; ronda < J.rondas ? pregunta() : fin(); });
  function pregunta(){
    rel.clear(); bloq = false; msg.textContent = ''; ctrl.innerHTML = ''; pinta();
    objetivo = azar(pool.filter(m => m !== objetivo)) ?? azar(pool);
    if(tipo === 'pentagrama'){ area.innerHTML = notaSolaSVG(objetivo); msg.textContent = 'Toca esta nota en el violín'; }
    else { area.innerHTML = '<button class="big-play" data-g-oirn aria-label="Escuchar la nota">▶</button>'; msg.textContent = 'Escucha y búscala en el violín';
      const oir = () => tone(mtof(objetivo), 1.1); $('[data-g-oirn]', area).onclick = oir; oir(); }
  }
  /* lluvia: la canción avanza con el pulso y hay que tocar cada nota a tiempo */
  let lluvia = null;
  function empezarLluvia(){
    const notas = (notasCancion && notasCancion.length ? notasCancion : EJERCICIOS.escala_re.notas).slice(0, 16);
    const ej = {frases:[notas], compas:4, notas};
    area.innerHTML = `<div class="notes-scroll penta-box">${pentagramaHTML(ej, {nombres:false})}</div>`;
    msg.textContent = 'Toca cada nota cuando se encienda'; ctrl.innerHTML = '<button class="btn primary big" data-g-ll>▶ Empezar</button>';
    $('[data-g-ll]', ctrl).onclick = () => {

      notas.forEach(([m, d], i) => {
        const w = t0 + t * spb;
        rel.at(w, () => { if(lluvia.activa >= 0 && !lluvia.tocada.has(lluvia.activa)) acierto(false); lluvia.activa = i; $$('.pn', area).forEach(p => p.classList.toggle('playing', +p.dataset.i === i)); });
        clickSuave(w); t += d;
      });
      rel.at(t0 + t * spb, () => { if(lluvia.activa >= 0 && !lluvia.tocada.has(lluvia.activa)) acierto(false); lluvia = null; fin(); });
    };
  }
  $$('.g-fb .dot', el).forEach(d => d.addEventListener('pointerdown', e => {
    e.preventDefault(); const m = +d.dataset.m; tone(mtof(m), .7);
    if(tipo === 'lluvia'){
      if(!lluvia || lluvia.activa < 0 || lluvia.tocada.has(lluvia.activa)) return;
      const ok = lluvia.notas[lluvia.activa][0] === m; lluvia.tocada.add(lluvia.activa); acierto(ok); marcarDot(m, ok ? 'hit' : 'mal'); msg.textContent = ok ? '¡Bien!' : `Era ${noteName(lluvia.notas[lluvia.activa][0])}`;
      return;
    }
    if(bloq || objetivo == null) return; bloq = true;
    const ok = m === objetivo; acierto(ok); marcarDot(m, ok ? 'hit' : 'mal'); if(!ok) marcarDot(objetivo, 'hit');
    const p = posFor(objetivo);

    if(tipo === 'oido') area.innerHTML = notaSolaSVG(objetivo);
    siguiente(ok);
  }));
  const inicio = () => tipo === 'lluvia' ? empezarLluvia() : pregunta();
  inicio();
  return () => rel.clear();
}

/* ============ cápsulas visuales 5 a 24 ============ */
/* tira de una cuerda con puntos de dedos: marcas = [{off, txt, cls}] */
function tiraSVG(cuerda, marcas, {desde = 0, hasta = 8} = {}){
  const S0 = STR[cuerda], W = 520, x = off => 40 + (off - desde) * ((W - 70) / (hasta - desde));
  let o = `<svg class="tira" viewBox="0 0 ${W} 110" role="img" aria-label="Cuerda ${S0.nombre}"><rect x="30" y="30" width="${W - 50}" height="50" rx="10" fill="#2A1F18"/><line x1="20" x2="${W - 16}" y1="55" y2="55" stroke="${S0.color}" stroke-width="4"/>`;

/* ============ mapa del bosque (inicio del alumno) ============ */
const DECO = ['evergreen-tree', 'deciduous-tree', 'mushroom', 'tulip', 'rabbit', 'fox', 'owl', 'deer', 'hedgehog', 'butterfly', 'snail', 'sunflower', 'herb', 'chipmunk', 'bird', 'four-leaf-clover', 'hut', 'wood', 'lady-beetle', 'frog'];
function mapaSVG(al, nivel){
  const nv = nivelObj(nivel), ls = nv.lecciones, W = 400, step = 140, top = 80;
  const actualNivel = al.nivel || 1, hecho = nivel < actualNivel || (nivel === actualNivel && nivelCompleto(al)), actual = nivel === actualNivel ? (al.leccion || 1) : hecho ? ls.length + 1 : 0;
  const pts = ls.map((L, i) => ({x:200 + 108 * Math.sin(i * 1.2), y:top + i * step}));
  const H = top + (ls.length - 1) * step + 110;
  const curva = pts.map((p, i) => { if(!i) return `M${p.x} ${p.y}`; const q = pts[i - 1], my = (q.y + p.y) / 2; return `C${q.x} ${my} ${p.x} ${my} ${p.x} ${p.y}`; }).join(' ');
  let seed = nivel * 97 + 13; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let deco = '';
  pts.forEach((p, i) => { const lado = p.x > 200 ? -1 : 1; for(let k = 0; k < 3; k++){ const img = DECO[Math.floor(rnd() * DECO.length)], dx = lado * (70 + rnd() * 90), dy = -40 + rnd() * 90, s = 30 + rnd() * 18; deco += `<image href="assets/emoji/${img}.svg" x="${Math.max(4, Math.min(W - s - 4, p.x + dx - s / 2))}" y="${p.y + dy - s / 2}" width="${s}" height="${s}"/>`; } });
  let o = `<svg class="mapa" viewBox="0 0 ${W} ${H}" role="list" aria-label="Mapa del Nivel ${nivel}">
    <defs><linearGradient id="mp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6ECC0"/><stop offset="1" stop-color="#B5DA97"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="28" fill="url(#mp)"/>
    <path d="M${W} ${H * .3} C ${W * .7} ${H * .38} ${W * .9} ${H * .55} ${W * .6} ${H * .62} S ${W * .1} ${H * .8} 0 ${H * .86}" stroke="#8CC8EA" stroke-width="26" fill="none" opacity=".7" stroke-linecap="round"/>
    ${deco}
    <path d="${curva}" stroke="#E9DCC2" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="${curva}" stroke="#D4C29E" stroke-width="26" fill="none" stroke-linecap="round" stroke-dasharray="2 22" opacity=".8"/>`;
  ls.forEach((L, i) => {
    const p = pts[i], n = L.n, est = (al.estrellas || {})[`${nivel}.${n}`] || 0;
    const st = n < actual ? 'done' : n === actual ? 'current' : 'locked', abierto = st !== 'locked' || S.preview;
    o += `<g class="mnode ${st}" role="listitem" ${abierto ? `tabindex="0" data-mapa="${nivel}.${n}"` : ''} aria-label="Lección ${n}: ${esc(L.titulo)}${st === 'locked' ? ', bloqueada' : ''}">
      ${st === 'current' ? `<circle class="ring" cx="${p.x}" cy="${p.y}" r="40"/><image href="assets/emoji/child.svg" x="${p.x + (p.x > 200 ? -96 : 50)}" y="${p.y - 24}" width="46" height="46"/>` : ''}
      <circle class="mdisc" cx="${p.x}" cy="${p.y}" r="38"/>
      ${st === 'locked' ? `<path d="M${p.x - 9} ${p.y - 2}v-6a9 9 0 0 1 18 0v6" stroke="var(--ink-2)" stroke-width="3.4" fill="none"/><rect x="${p.x - 13}" y="${p.y - 3}" width="26" height="20" rx="4" fill="var(--ink-2)"/>` : `<text x="${p.x}" y="${p.y + 9}" text-anchor="middle" class="mnum">${n}</text>`}
      ${st !== 'locked' ? `<text x="${p.x}" y="${p.y + 58}" text-anchor="middle" class="mst">${[1, 2, 3].map(k => `<tspan class="${k <= est ? '' : 'off'}">★</tspan>`).join('')}</text>` : ''}
      ${(() => { const w = Math.min(300, L.titulo.length * 8.4 + 32), cx = Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, p.x)); return `<g transform="translate(${cx} ${p.y + (st !== 'locked' ? 78 : 60)})"><rect x="${-w / 2}" y="-13" width="${w}" height="26" rx="13" class="mtag"/><text y="5" text-anchor="middle" class="mtit">${esc(L.titulo)}</text></g>`; })()}
    </g>`;
  });
  return o + '</svg>';
}

}

/* ---- vista 4: brazo del arco según la cuerda ---- */
const ALTURA_CUERDA = [{id:'sol', codo:138, ang:-30}, {id:'re', codo:164, ang:-10}, {id:'la', codo:192, ang:10}, {id:'mi', codo:220, ang:30}];
function dibujoBrazo(i){
  const c = ALTURA_CUERDA[i], puente = [330, 200];
  const cuerdas = ALTURA_CUERDA.map((q, k) => { const a = (-54 + k * 36) * Math.PI / 180; return [puente[0] + 58 * Math.sin(a), puente[1] - 58 * Math.cos(a) + 40]; });
  const toque = cuerdas[i], rad = c.ang * Math.PI / 180, dir = [Math.cos(rad), Math.sin(rad)];
  const mano = [toque[0] - dir[0] * 100, toque[1] - dir[1] * 100];
  const hombro = [60, 104], codo = [104, c.codo];
  return `<svg viewBox="0 0 440 320" class="p2d" role="img" aria-label="Altura del brazo del arco en la cuerda ${STR[c.id].nombre}">
    <rect x="0" y="0" width="440" height="320" rx="20" fill="var(--surface-2)"/>
    <path d="M${puente[0] - 80} 300C${puente[0] - 80} 200 ${puente[0] - 50} 176 ${puente[0]} 176S${puente[0] + 80} 200 ${puente[0] + 80} 300z" fill="${CUERPO.madera}" opacity=".35"/>
    <path d="M${puente[0] - 62} 262C${puente[0] - 60} 212 ${puente[0] - 32} 186 ${puente[0]} 186S${puente[0] + 60} 212 ${puente[0] + 62} 262z" fill="#E9DCC2" stroke="#8a6528" stroke-width="2"/>
    ${cuerdas.map((p, k) => `<circle cx="${p[0]}" cy="${p[1]}" r="${k === i ? 9 : 6}" fill="${STR[ALTURA_CUERDA[k].id].color}" stroke="#fff" stroke-width="2"/>`).join('')}
    <circle cx="${hombro[0]}" cy="${hombro[1]}" r="20" fill="${CUERPO.camisa}" stroke="${CUERPO.borde}" stroke-width="3"/>
    ${seg(hombro[0], hombro[1], codo[0], codo[1], CUERPO.brazo, 28)}
    ${seg(codo[0], codo[1], mano[0] - 10, mano[1], CUERPO.antebrazo, 24)}
    <circle cx="${codo[0]}" cy="${codo[1]}" r="13" fill="${CUERPO.antebrazo}" stroke="${CUERPO.borde}" stroke-width="2.5"/>
    <path d="M${mano[0]} ${mano[1]}L${toque[0] + dir[0] * 70} ${toque[1] + dir[1] * 70}" stroke="#8B5E3C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="${mano[0]}" cy="${mano[1]}" r="16" fill="${CUERPO.mano}" stroke="${CUERPO.borde}" stroke-width="3"/>
    <g class="rots">
      ${rotulo(codo[0] - 6, codo[1] + 8, 90, 296, i === 0 ? 'Codo alto' : i === 3 ? 'Codo bajo' : 'Codo a media altura', 'var(--pine)')}
      ${rotulo((hombro[0] + codo[0]) / 2 + 12, (hombro[1] + codo[1]) / 2, 150, 60, 'Brazo', CUERPO.brazo)}
      ${rotulo((codo[0] + mano[0]) / 2, (codo[1] + mano[1]) / 2 + 10, 230, 296, 'Antebrazo', CUERPO.antebrazo)}
      ${rotulo(toque[0], toque[1] - 10, 370, 60, `Cuerda ${STR[c.id].nombre}`, STR[c.id].color)}
    </g>
  </svg>`;
}

const VISTAS_2D = {
  postura:{nombre:'Postura', dibujo:dibujoPostura, bien:'Pies separados, espalda larga, violín en el hombro y mirando hacia la voluta.', errores:[{id:'hombro', txt:'Hombro levantado', no:'El hombro sube a buscar el violín: se cansa y aprieta.'}, {id:'caido', txt:'Violín caído', no:'La voluta cae hacia el piso y el arco se resbala.'}]},
  izq:{nombre:'Mano izquierda', dibujo:dibujoIzq, bien:'Dedos redondos como una casita, pulgar suave y muñeca recta.', errores:[{id:'plana', txt:'Dedos planos', no:'Los dedos acostados tocan dos cuerdas a la vez.'}, {id:'doblada', txt:'Muñeca doblada', no:'La muñeca se hunde y los dedos no llegan.'}]},
  der:{nombre:'Mano del arco', dibujo:dibujoDer, bien:'Pulgar doblado, meñique curvo arriba y dedos sueltos sobre la vara.', errores:[{id:'pulgar', txt:'Pulgar recto', no:'El pulgar tieso aprieta el arco y el sonido raspa.'}, {id:'menique', txt:'Meñique estirado', no:'El meñique estirado no sostiene el peso del arco.'}]},
  brazo:{nombre:'Brazo del arco', dibujo:dibujoBrazo, bien:'Codo alto para Sol, más bajo para Re y La, y bajito para Mi.', errores:[]}
};
function mountPostura(el, {vista = 'postura', big = false} = {}){
  let v = VISTAS_2D[vista] ? vista : 'postura', err = null, cuerda = 0, nombres = true, auto = 0;
  const pinta = () => {
    const V = VISTAS_2D[v], E = V.errores.find(e => e.id === err);
    el.innerHTML = `<div class="p2d-wrap${big ? ' big' : ''}">
      <div class="seg" role="group" aria-label="Qué mirar">${Object.entries(VISTAS_2D).map(([id, x]) => `<button data-p2v="${id}" aria-pressed="${id === v}">${x.nombre}</button>`).join('')}</div>
      <div class="p2d-stage${nombres ? '' : ' sin-nombres'}">${v === 'brazo' ? dibujoBrazo(cuerda) : V.dibujo(err)}</div>
      <p class="p2d-cap">${E ? `<b class="no">Así no:</b> ${esc(E.no)}` : `<b class="si">Así sí:</b> ${esc(V.bien)}`}</p>
      <div class="row" style="justify-content:center">
        ${v === 'brazo' ? ALTURA_CUERDA.map((q, k) => `<button class="btn small${k === cuerda ? ' primary' : ''}" data-p2c="${k}">${STR[q.id].nombre}</button>`).join('') + `<button class="btn small" data-p2auto>${auto ? '■ Detener' : '▶ Recorrer las cuerdas'}</button>` : ''}
        ${V.errores.map(e => `<button class="btn small${err === e.id ? ' danger-on' : ''}" data-p2e="${e.id}">${err === e.id ? 'Ver así sí' : 'Así no: ' + e.txt.toLowerCase()}</button>`).join('')}
        <label class="switch"><input type="checkbox" data-p2n ${nombres ? 'checked' : ''}> Nombres</label>
      </div>
      <div class="p2d-leyenda"><span><i style="background:${CUERPO.brazo}"></i>Brazo</span><span><i style="background:${CUERPO.antebrazo}"></i>Antebrazo</span><span><i style="background:${CUERPO.mano};border:1px solid ${CUERPO.borde}"></i>Mano</span></div>
    </div>`;
    $$('[data-p2v]', el).forEach(b => b.onclick = () => { v = b.dataset.p2v; err = null; parar(); pinta(); });
    $$('[data-p2e]', el).forEach(b => b.onclick = () => { err = err === b.dataset.p2e ? null : b.dataset.p2e; pinta(); });
    $$('[data-p2c]', el).forEach(b => b.onclick = () => { parar(); cuerda = +b.dataset.p2c; tone(mtof(STR[ALTURA_CUERDA[cuerda].id].midi), 1); pinta(); });
    const a = $('[data-p2auto]', el); if(a) a.onclick = () => { if(auto){ parar(); pinta(); return; } auto = setInterval(() => { cuerda = (cuerda + 1) % 4; tone(mtof(STR[ALTURA_CUERDA[cuerda].id].midi), .9); pinta(); }, 1300); pinta(); };
    $('[data-p2n]', el).onchange = e => { nombres = e.target.checked; pinta(); };
  };
  const parar = () => { clearInterval(auto); auto = 0; };
  pinta();
  return () => parar();
}

/* ============ modo presentación ============ */
function openPresent(tab){ S.present = true; S.presentTab = tab || 'postura'; renderPresent(); }
function closePresent(){ S.present = false; clearPresentMounts(); const p = $('#present'); if(p){ p.hidden = true; p.innerHTML = ''; } document.body.style.overflow = ''; }
let presentKey = '';
function renderPresent(fromData){
  const p = $('#present'); const al = Store.get(S.maestraSel); if(!p || !al){ closePresent(); return; }
  const n = leccionActual(al); const L = lec(n, al.nivel);
  const key = `${al.id}:${n}:${cancionDe(al, n)}:${S.presentTab}:${S.practica}`;
  if(fromData && key === presentKey && !p.hidden) return;
  presentKey = key;
  clearPresentMounts(); stopPlay();
  p.hidden = false; document.body.style.overflow = 'hidden';
  p.innerHTML = `<div class="present-top">
      <div class="brand">${treeIcon(28, 'var(--pine)')}</div>
      <div class="ttl"><strong>${esc(al.nombre)}</strong><span>Nivel ${al.nivel || 1}, lección ${n}: ${esc(L.titulo)}</span></div>
      <div class="tabs" role="tablist">${PTABS.map(t => `<button class="tab" role="tab" data-ptab="${t.id}" aria-selected="${t.id === S.presentTab}">${t.label}</button>`).join('')}</div>
      <button class="btn" data-pclose>Salir de la presentación</button>
    </div>
    <div class="present-body" id="present-body"></div>
    <p class="present-tip">En Google Meet: Presentar ahora, elige «Una pestaña» y selecciona esta pestaña del navegador.</p>`;
  updateLiveDots();
  const body = $('#present-body');
  if(S.presentTab === 'postura') presentMounts.push(mountPostura(body, {vista:VISTA_2D[L.vista] || 'postura', big:true}));
  if(S.presentTab === 'fb') presentMounts.push(mountFingerboard(body, al, L, {big:true}));
  if(S.presentTab === 'metro') presentMounts.push(mountMetronome(body, {big:true}));
  if(S.presentTab === 'tuner') presentMounts.push(mountTuner(body, {big:true}));
  if(S.presentTab === 'ritmo') presentMounts.push(mountRitmoPanel(body, al, L));
  if(S.presentTab === 'cap') presentMounts.push(mountCapsulasPanel(body, L));
  if(S.presentTab === 'sheet'){ body.innerHTML = `<div class="card" style="max-width:1200px;margin:0 auto">${sheetBlockHTML(al, L)}</div>`; wireSheet(body, al, L); presentMounts.push(() => stopPlay()); }
  $('[data-pclose]', p).onclick = closePresent;
  $$('[data-ptab]', p).forEach(b => b.onclick = () => { S.presentTab = b.dataset.ptab; renderPresent(); });
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.present) closePresent(); });


/* ============ inicio ============ */
(async function iniciar(){
  const ses = leerSesion();
  if(ses && ses.rol){
    $('#app').innerHTML = '<div class="loading">Abriendo el club…</div>';
    try{
      if(ses.rol === 'alumno'){ await Store.entrarAlumno(ses.codigo); Object.assign(S, {rol:'alumno', codigo:ses.codigo, clave:''}); go('alumno'); return; }
      if(ses.rol === 'maestro' || ses.rol === 'admin' || ses.rol === 'maestra'){ S.clave = ses.clave; S.codigo = ''; await Store.entrarConClave(ses.clave); go('maestra'); return; }
    }catch(e){ borrarSesion(); toast(e.message); }
  }
  go('login');
})();
/* al volver a la pestaña, trae los cambios que hizo la maestra (máximo una vez por minuto) */
let ultimaCarga = Date.now();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !S.rol || Date.now() - ultimaCarga < 60000) return;
  if(ED || S.present) return;
  ultimaCarga = Date.now(); Store.refrescar();
});
