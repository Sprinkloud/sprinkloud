<!DOCTYPE html>
<!-- Imagen de vista previa del enlace (Open Graph, 1200×630): la que sale en WhatsApp al mandar el enlace del bosque.
     Se fotografía con Playwright a 1200×630 → assets/vista-previa.jpg (ver CLAUDE.md). -->
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,SOFT,wght@9..144,100,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #F6F0E2; font-family: Fraunces, Georgia, serif; }
  body::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(70% 90% at 12% 10%, rgba(196, 146, 58, .16), transparent 60%), radial-gradient(60% 80% at 100% 100%, rgba(100, 119, 69, .18), transparent 60%); }
  .osito { position: absolute; left: 40px; top: 40px; width: 560px; height: 550px; border-radius: 48% 52% 46% 54% / 50% 46% 54% 50%; overflow: hidden;
    box-shadow: 0 0 0 12px #FFFDF8, 0 24px 40px -18px rgba(58, 49, 40, .55); }
  .osito img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transform: scale(1.18); }
  .texto { position: absolute; left: 640px; right: 40px; top: 0; bottom: 0; display: grid; align-content: center; justify-items: center; text-align: center; gap: 4px; }
  .texto .logo { width: 440px; mix-blend-mode: multiply; }
  .texto .bosque { font-family: Caveat, cursive; font-weight: 600; font-size: 64px; color: #9C6F22; line-height: 1; margin-top: 6px; }
  .texto .sub { font-size: 25px; color: #48592F; font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>
  <div class="osito"><img src="../assets/ilustraciones/osito-bosque.webp" alt=""></div>
  <div class="texto">
    <img class="logo" src="logo-recorte.png" alt="Sprinkloud">
    <div class="bosque">El bosque de Sprinkloud</div>
    <div class="sub">Tu práctica de música de cada día 🔥</div>
  </div>
</body>
</html>
